<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
<title>HyperOS Launcher</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
}
img.wallpaper {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}
</style>
</head>
<body>

<img class="wallpaper" src="https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/4b5d40216256937.67b492e0e7551.jpg" alt="">

<script>
// Block right-click menu
document.addEventListener('contextmenu', e => e.preventDefault());

// Block pull-to-refresh, swipe gestures
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// Block double-tap zoom
document.addEventListener('dblclick', e => e.preventDefault());

// Block pinch zoom
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());

// Force fullscreen on first click/tap
function goFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }
  document.removeEventListener('click', goFullscreen);
  document.removeEventListener('touchend', goFullscreen);
}
document.addEventListener('click', goFullscreen);
document.addEventListener('touchend', goFullscreen);

// Re-enter fullscreen if user exits (press Esc)
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    setTimeout(() => {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }, 500);
  }
});

// Block keyboard shortcuts (F11, Ctrl+L, etc.)
document.addEventListener('keydown', e => {
  if (e.key === 'F11' || e.key === 'Escape') e.preventDefault();
  if (e.ctrlKey || e.altKey || e.metaKey) e.preventDefault();
});
</script>

</body>
</html>
