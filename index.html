<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
<title>HyperOS Launcher</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
  font-family: -apple-system, "SF Pro Display", "Noto Sans SC", system-ui, sans-serif;
}

/* ─── Wallpaper ─── */
img.wallpaper {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* ─── Background Overlay ─── */
.bg-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.35);
  z-index: 15;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}
.bg-overlay.active { opacity: 1; }

/* ─── Dock ─── */
.dock-wrap {
  position: fixed;
  bottom: 58px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  transition: opacity 0.45s ease, transform 0.45s ease;
}
.dock-wrap.hidden {
  opacity: 0;
  transform: translateX(-50%) translateY(30px);
  pointer-events: none;
}
.dock {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 13px 13px;
  border-radius: 29px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-top-color: rgba(255,255,255,0.14);
  box-shadow: 0 8px 48px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.1);
  position: relative;
}
.dock::before {
  content: '';
  position: absolute;
  top: -1px; left: 15%; right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
}

/* ─── App Icon (ใน dock) ─── */
.app-icon {
  width: 52px; height: 52px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s ease, opacity 0.2s ease;
  position: relative;
  overflow: hidden;
}
.app-icon:active { transform: scale(0.88); }
.app-icon::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.04) 100%);
  border-radius: 15px 15px 0 0;
  pointer-events: none;
}
.app-icon svg { position: relative; z-index: 1; }

/* ─── App Icon เมื่ออยู่ใน box_anim ─── */
.box-anim > .app-icon {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border-radius: 42px;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s ease;
}
.box-anim > .app-icon.icon-visible {
  opacity: 1;
}
.box-anim > .app-icon svg {
  width: 52%; height: 52%;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
}

/* ─── BOX_anim ─── */
.box-anim {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: none;
  transform-origin: 0 0;
  will-change: transform;
}
.box-anim.passthrough { pointer-events: none; }
.box-anim.z-closing { z-index: 20; }
.box-anim.z-open    { z-index: 22; }

/* Box WEB */
.box-web {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #fff;
  overflow: hidden;
  will-change: border-radius;
}
.box-web iframe {
  width: 100%; height: 100%;
  border: none; display: block;
}
.box-anim.passthrough .box-web,
.box-anim.passthrough iframe {
  pointer-events: none;
}

/* ─── Gesture Pill ใน BOX_anim ─── */
.box-gesture-pill {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 5px;
  border-radius: 3px;
  background: #fff;
  mix-blend-mode: difference;
  pointer-events: none;
  z-index: 5;
  opacity: 1;
}

/* ─── Gesture Bar (touch area อย่างเดียว) ─── */
.gesture-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  height: 44px;
  z-index: 50;
  touch-action: none;
  cursor: grab;
}
.gesture-bar:active { cursor: grabbing; }
</style>
</head>
<body>

<img class="wallpaper" src="https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/4b5d40216256937.67b492e0e7551.jpg" alt="">

<div class="bg-overlay" id="bgOverlay"></div>

<!-- BOX_anim A -->
<div class="box-anim z-open" id="boxAnim0">
  <div class="box-web" id="boxWeb0">
    <iframe id="appFrame0" src="" allow="autoplay; fullscreen"></iframe>
  </div>
  <div class="box-gesture-pill" id="boxPill0"></div>
</div>

<!-- BOX_anim B -->
<div class="box-anim z-open" id="boxAnim1">
  <div class="box-web" id="boxWeb1">
    <iframe id="appFrame1" src="" allow="autoplay; fullscreen"></iframe>
  </div>
  <div class="box-gesture-pill" id="boxPill1"></div>
</div>

<!-- Gesture Bar (touch area only) -->
<div class="gesture-bar" id="gestureBar"></div>

<!-- Dock -->
<div class="dock-wrap" id="dockWrap">
  <div class="dock">
    <div class="app-icon" style="background: linear-gradient(145deg, #CFD8DC, #546E7A);" id="btnSettings" data-url="settings.html">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="white" fill-opacity=".88">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/>
      </svg>
    </div>
    <div class="app-icon" style="background: linear-gradient(145deg, #EF9A9A, #C62828);" id="btnYouTube" data-url="youtube.html">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="white" fill-opacity=".9">
        <path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/>
      </svg>
    </div>
    <div class="app-icon" style="background: linear-gradient(145deg, #90A4AE, #37474F);" id="btnCamera" data-url="camera.html">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="white" fill-opacity=".88">
        <path d="M12 15.2a3.2 3.2 0 100-6.4 3.2 3.2 0 000 6.4z"/>
        <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
      </svg>
    </div>
    <div class="app-icon" style="background: linear-gradient(145deg, #FFCC80, #E65100);" id="btnCalc" data-url="calculator.html">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="white" fill-opacity=".88">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7.5 4h5v2h-5V7zm0 4h5v2h-5v-2zM7 7h2v2H7V7zm0 4h2v2H7v-2zm0 4h2v2H7v-2zm4.5 0h5v2h-5v-2z"/>
      </svg>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  APP URL MAP
// ═══════════════════════════════════════════════════════════

function appPage(title, bg, color) {
  return 'data:text/html;charset=utf-8,' + encodeURIComponent(
    '<html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head>' +
    '<body style="margin:0;padding:0;background:' + bg + ';display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif">' +
    '<p style="color:' + color + ';font-size:28px;font-weight:300">' + title + '</p></body></html>'
  );
}

const APP_URLS = {
  btnSettings: appPage('Settings', '#f5f5f5', 'rgba(0,0,0,0.12)'),
  btnYouTube:  appPage('YouTube',  '#0f0f0f', 'rgba(255,255,255,0.12)'),
  btnCamera:   appPage('Camera',   '#000000', 'rgba(255,255,255,0.08)'),
  btnCalc:     appPage('Calculator','#f0f0f0', 'rgba(0,0,0,0.12)'),
};

// ═══════════════════════════════════════════════════════════
//  BOX POOL
// ═══════════════════════════════════════════════════════════

const boxPool = [
  {
    idx: 0,
    el:    document.getElementById('boxAnim0'),
    web:   document.getElementById('boxWeb0'),
    frame: document.getElementById('appFrame0'),
    pill:  document.getElementById('boxPill0'),
    state: 'idle',    // idle | opening | open | dragging | closing
    icon: null,
    target: null,     // ★ จำตำแหน่ง ICON ไว้ตอนเปิด
    rafId: null,
    openTimer: null,
    dragCurrentX: 0,
    dragCurrentY: 0,
  },
  {
    idx: 1,
    el:    document.getElementById('boxAnim1'),
    web:   document.getElementById('boxWeb1'),
    frame: document.getElementById('appFrame1'),
    pill:  document.getElementById('boxPill1'),
    state: 'idle',
    icon: null,
    target: null,
    rafId: null,
    openTimer: null,
    dragCurrentX: 0,
    dragCurrentY: 0,
  }
];

// ─── Global State ───
let appState = 'closed';
const gestureBar = document.getElementById('gestureBar');
const dockWrap   = document.getElementById('dockWrap');
const bgOverlay  = document.getElementById('bgOverlay');

// ─── Velocity ───
let dragStartX = 0, dragStartY = 0;
let lastMoveX = 0, lastMoveY = 0, lastMoveTime = 0;
let velocityX = 0, velocityY = 0;
let activeDragBox = null;

// ─── Dock placeholder ───
const dockPlaceholders = new Map();

// ─── Tuning ───
const R_ICON = 42;
const CLOSE_UP_PX = Math.round(window.innerHeight * 0.08);
const OPEN_MS = 550;
const SNAP_MS = 550;
const VELOCITY_CLOSE = 0.35;
const SPEED = 3.5;
const FLING = 1.8;
const DRAG_SHRINK = 0.30;

// ═══════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════

function getIconTransform(iconRect) {
  const W = window.innerWidth;
  const H = window.innerHeight;
  const sx = iconRect.width / W;
  const sy = iconRect.height / H;
  const tx = iconRect.left + iconRect.width / 2 - W * sx / 2;
  const ty = iconRect.top + iconRect.height / 2 - H * sy / 2;
  return { tx, ty, sx, sy };
}

// ★ border-radius แบบค่าเดียว หารด้วย scale
function calcRadius(progress, scale) {
  const visualR = progress * R_ICON;
  return visualR / Math.max(0.01, scale) + 'px';
}

// ★ ปรับ border-radius ของ icon ให้ชดเชย non-uniform scale(sx,sy)
// ใช้ Rh/Rv syntax: visual radius = R_ICON ทุกทิศ
function fixIconRadius(iconEl, sx, sy) {
  if (!iconEl) return;
  iconEl.style.borderRadius = (R_ICON / Math.max(0.01, sx)) + 'px / ' + (R_ICON / Math.max(0.01, sy)) + 'px';
}

function resetIconRadius(iconEl) {
  if (!iconEl) return;
  iconEl.style.borderRadius = '';
}

function shouldClose() {
  if (activeDragBox && activeDragBox.dragCurrentY < -CLOSE_UP_PX) return true;
  if (velocityY < -VELOCITY_CLOSE) return true;
  return false;
}

function applySticky(rawX, rawY) {
  const H = window.innerHeight;
  const W = window.innerWidth;
  const FREE_ZONE_Y = H * 0.40;
  const DIM_Y = H * 0.2;
  let sy = rawY;
  if (rawY < 0) {
    const absY = Math.abs(rawY);
    if (absY <= FREE_ZONE_Y) {
      sy = rawY;
    } else {
      const excess = absY - FREE_ZONE_Y;
      sy = -(FREE_ZONE_Y + DIM_Y * (1 - 1 / (1 + excess / DIM_Y)));
    }
  }
  const FREE_ZONE_X = W * 0.1;
  const DIM_X = W * 0.4;
  let sx = rawX;
  const absX = Math.abs(rawX);
  if (absX > FREE_ZONE_X) {
    const excess = absX - FREE_ZONE_X;
    const compressed = FREE_ZONE_X + DIM_X * (1 - 1 / (1 + excess / DIM_X));
    sx = rawX > 0 ? compressed : -compressed;
  }
  return { x: sx, y: sy };
}

// ─── ease-out smooth (近似 cubic-bezier(0.16, 1, 0.3, 1)) ───
function easeOutSmooth(t) {
  return 1 - Math.pow(1 - t, 2.8);
}

function findOpenBox() {
  return boxPool.find(b => b.state === 'open') || null;
}
function findIdleBox() {
  return boxPool.find(b => b.state === 'idle') || null;
}
function findClosingBox() {
  return boxPool.find(b => b.state === 'closing') || null;
}

function updateGlobalUI() {
  const openBox = findOpenBox();
  const hasOpen = !!openBox;
  const hasBusy = boxPool.some(b => b.state === 'opening' || b.state === 'closing');
  const shouldHideDock = hasOpen || boxPool.some(b => b.state === 'opening');
  dockWrap.classList.toggle('hidden', shouldHideDock);
  if (shouldHideDock) {
    bgOverlay.classList.add('active');
    bgOverlay.style.opacity = '';
  } else {
    bgOverlay.classList.remove('active');
    bgOverlay.style.opacity = '';
  }
  if (hasOpen) appState = 'open';
  else if (hasBusy) appState = 'transitioning';
  else appState = 'closed';
}

// ─── ย้ายไอคอน dock ↔ box ───
function moveIconToBox(iconEl, box) {
  const iconId = iconEl.id;
  let ph = dockPlaceholders.get(iconId);
  if (!ph) {
    ph = document.createElement('div');
    ph.style.cssText = 'width:52px;height:52px;flex-shrink:0;border-radius:15px;cursor:pointer;';
    dockPlaceholders.set(iconId, ph);
  }
  ph.onclick = () => { openApp(iconEl, APP_URLS[iconId]); };
  const dock = document.querySelector('.dock');
  if (iconEl.parentElement === dock) {
    dock.insertBefore(ph, iconEl);
  } else if (!ph.parentElement) {
    dock.appendChild(ph);
  }
  box.el.appendChild(iconEl);
}

function moveIconToDock(iconEl) {
  const iconId = iconEl.id;
  const ph = dockPlaceholders.get(iconId);
  const dock = document.querySelector('.dock');
  if (ph && ph.parentElement) {
    ph.parentElement.insertBefore(iconEl, ph);
    ph.remove();
  } else if (dock) {
    dock.appendChild(iconEl);
  }
  iconEl.classList.remove('icon-visible');
  resetIconRadius(iconEl); // ★ คืน border-radius เป็น CSS default
}

// ═══════════════════════════════════════════════════════════
//  OPEN APP — ใช้ rAF animation (ไม่ใช้ CSS transition)
// ═══════════════════════════════════════════════════════════

function openApp(iconEl, url) {
  const currentOpen = findOpenBox();
  if (currentOpen && currentOpen.icon === iconEl) {
    closeBox(currentOpen);
    return;
  }

  // ถ้าไอคอนอยู่ใน box อื่น → force-reset
  const iconInBox = boxPool.find(b => b.icon === iconEl && b.state !== 'idle');
  if (iconInBox) forceResetBox(iconInBox);

  // ถ้ามี box ที่เปิด/กำลังเปิด → ปิดมัน
  const busyBox = boxPool.find(b => b.state === 'open' || b.state === 'opening');
  if (busyBox) closeBox(busyBox);

  // หา idle box
  let box = findIdleBox();
  if (!box) {
    const closingBox = findClosingBox();
    if (closingBox) forceResetBox(closingBox);
    box = findIdleBox();
  }
  if (!box) return;

  // วัดตำแหน่ง icon
  void document.body.offsetHeight;
  const iconRect = iconEl.getBoundingClientRect();
  const iconTf = getIconTransform(iconRect);

  box.target = iconTf;
  box.icon = iconEl;
  moveIconToBox(iconEl, box);

  // ★ Setup initial state
  box.el.style.display = 'block';
  box.el.style.transition = 'none';
  box.web.style.transition = 'none';
  box.el.style.transform = 'translate(' + iconTf.tx + 'px,' + iconTf.ty + 'px) scale(' + iconTf.sx + ',' + iconTf.sy + ')';
  box.el.classList.remove('passthrough');
  box.el.classList.remove('z-closing');
  box.el.classList.add('z-open');

  iconEl.classList.add('icon-visible');
  fixIconRadius(iconEl, iconTf.sx, iconTf.sy); // ★ ชดเชย non-uniform scale
  box.web.style.borderRadius = calcRadius(1, Math.min(iconTf.sx, iconTf.sy));
  box.web.style.background = 'transparent';
  box.web.style.opacity = '1';
  box.pill.style.opacity = '1';

  box.frame.src = '';
  void box.el.offsetHeight;

  // ★ rAF opening animation
  box.state = 'opening';
  const startTime = performance.now();
  const fromTx = iconTf.tx, fromTy = iconTf.ty;
  const fromSx = iconTf.sx, fromSy = iconTf.sy;
  let iconFaded = false;

  function tickOpen(now) {
    // ถ้าถูกขัดจังหวะ (closeBox/forceReset) → หยุด
    if (box.state !== 'opening') return;

    const elapsed = now - startTime;
    let t = Math.min(elapsed / OPEN_MS, 1);
    const et = easeOutSmooth(t);

    const curSx = fromSx + (1 - fromSx) * et;
    const curSy = fromSy + (1 - fromSy) * et;
    const curTx = fromTx * (1 - et);
    const curTy = fromTy * (1 - et);

    const minS = Math.min(curSx, curSy);

    // ★ ปรับ icon border-radius ทุกเฟรม
    fixIconRadius(iconEl, curSx, curSy);

    // border-radius: progress จาก 1 (icon) → 0 (full screen)
    const radiusProgress = 1 - et;
    box.web.style.borderRadius = calcRadius(radiusProgress, minS);

    box.el.style.transform = 'translate(' + curTx + 'px,' + curTy + 'px) scale(' + curSx + ',' + curSy + ')';

    // icon fade out ที่ ~25%
    if (!iconFaded && t > 0.25) {
      iconFaded = true;
      iconEl.classList.remove('icon-visible');
      box.web.style.background = '#fff';
    }

    if (t < 1) {
      box.rafId = requestAnimationFrame(tickOpen);
    } else {
      // Animation complete
      box.el.style.transform = 'none';
      box.web.style.borderRadius = '0px';
      resetIconRadius(iconEl);
      box.state = 'open';
      box.rafId = null;
      updateGlobalUI();
    }
  }

  box.rafId = requestAnimationFrame(tickOpen);

  // Load iframe
  if (box.openTimer) clearTimeout(box.openTimer);
  box.openTimer = setTimeout(() => { box.frame.src = url; box.openTimer = null; }, 100);

  box.dragCurrentX = 0;
  box.dragCurrentY = 0;
  updateGlobalUI();
}

// ═══════════════════════════════════════════════════════════
//  CLOSE BOX — spring animation (rAF)
// ═══════════════════════════════════════════════════════════

function closeBox(box) {
  if (box.state !== 'open' && box.state !== 'opening' && box.state !== 'dragging') return;
  box.state = 'closing';

  if (box.openTimer) { clearTimeout(box.openTimer); box.openTimer = null; }
  if (box.rafId)     { cancelAnimationFrame(box.rafId); box.rafId = null; }

  const W = window.innerWidth;
  const H = window.innerHeight;

  // ★ อ่าน visual state ปัจจุบัน
  const rect = box.el.getBoundingClientRect();
  const startTx = rect.left;
  const startTy = rect.top;
  const startSx = rect.width / W;
  const startSy = rect.height / H;

  box.el.style.transition = 'none';
  box.web.style.transition = 'none';
  box.el.style.transform = 'translate(' + startTx + 'px,' + startTy + 'px) scale(' + startSx + ',' + startSy + ')';

  // Target = จำไว้ตอนเปิด
  const target = box.target;
  if (!target) { finishBoxClose(box); return; }

  const tTx = target.tx, tTy = target.ty, tSx = target.sx, tSy = target.sy;

  let p = 0;
  let pVel = 5 * SPEED;
  let oY = 0;
  const swipeSpeed = Math.sqrt(velocityX * velocityX + velocityY * velocityY);
  const flingHeight = FLING * (Math.max(swipeSpeed, 0.05) * 0.5 + 0.06) * H;
  let oYVel = -4 * FLING;

  const pStiff = 15 * SPEED * SPEED;
  const pDamp  = 9 * SPEED;
  const oStiff = 20 * SPEED * SPEED;
  const oDamp  = 10 * SPEED;

  box.el.classList.add('passthrough');
  box.el.classList.remove('z-open');
  box.el.classList.add('z-closing');

  let totalMs = 0;
  const maxMs = 1500;
  let lastTs = null;
  let settled = false;
  let iconShown = false;

  function tick(ts) {
    if (!lastTs) lastTs = ts;
    const frameMs = Math.min(ts - lastTs, 32);
    lastTs = ts;
    totalMs += frameMs;
    if (totalMs > maxMs) { finishBoxClose(box); return; }

    const steps = Math.max(1, Math.round(frameMs / 4));
    const dt = (frameMs / 1000) / steps;
    for (let i = 0; i < steps; i++) {
      const fp = -pStiff * (p - 1) - pDamp * pVel;
      pVel += fp * dt; p += pVel * dt;
      const fo = -oStiff * oY - oDamp * oYVel;
      oYVel += fo * dt; oY += oYVel * dt;
    }
    p = Math.max(0, Math.min(1.02, p));

    const curTx = startTx + (tTx - startTx) * p;
    const curTy = startTy + (tTy - startTy) * p + oY * flingHeight;
    const curSx = startSx + (tSx - startSx) * p;
    const curSy = startSy + (tSy - startSy) * p;

    const clampSx = Math.max(tSx * 0.5, Math.min(1.1, curSx));
    const clampSy = Math.max(tSy * 0.5, Math.min(1.1, curSy));
    const minS = Math.min(clampSx, clampSy);

    const sizeProgress = Math.max(0, Math.min(1, (1 - minS) / (1 - Math.min(tSx, tSy))));
    const cssR = calcRadius(sizeProgress, minS);

    // ★ แสดง icon + ปรับ border-radius ชดเชย non-uniform scale
    if (!iconShown && minS < 0.3 && box.icon) {
      iconShown = true;
      box.icon.classList.add('icon-visible');
      box.web.style.background = 'transparent';
    }
    if (iconShown && box.icon) {
      fixIconRadius(box.icon, clampSx, clampSy);
    }

    // fade pill
    if (box.pill) box.pill.style.opacity = Math.max(0, 1 - sizeProgress * 2.5);

    box.el.style.transform = 'translate(' + curTx + 'px,' + curTy + 'px) scale(' + clampSx + ',' + clampSy + ')';
    box.web.style.borderRadius = cssR;

    const pDist = Math.abs(p - 1);
    const oYAbs = Math.abs(oY);
    const oYVelAbs = Math.abs(oYVel);

    if (!settled && pDist < 0.003 && oYAbs < 0.01 && oYVelAbs < 0.1) {
      settled = true;
      box.el.style.transition = 'transform 250ms cubic-bezier(0.25, 0, 0.15, 1)';
      box.el.style.transform = 'translate(' + tTx + 'px,' + tTy + 'px) scale(' + tSx + ',' + tSy + ')';
      box.web.style.transition = 'border-radius 250ms cubic-bezier(0.25, 0, 0.15, 1), opacity 250ms ease';
      box.web.style.borderRadius = calcRadius(1, Math.min(tSx, tSy));
      box.web.style.opacity = '0';
      if (box.icon) fixIconRadius(box.icon, tSx, tSy);
      setTimeout(() => finishBoxClose(box), 260);
      return;
    }

    box.rafId = requestAnimationFrame(tick);
  }

  box.rafId = requestAnimationFrame(tick);
  updateGlobalUI();
}

function finishBoxClose(box) {
  if (box.rafId) { cancelAnimationFrame(box.rafId); box.rafId = null; }
  box.el.style.display = 'none';
  box.el.style.transform = 'none';
  box.el.style.transition = 'none';
  box.el.classList.remove('passthrough');
  box.el.classList.remove('z-closing');
  box.el.classList.add('z-open');
  box.web.style.opacity = '1';
  box.web.style.borderRadius = '0px';
  box.web.style.background = '#fff';
  box.web.style.transition = 'none';
  box.pill.style.opacity = '1';
  if (box.icon) moveIconToDock(box.icon); // ★ คืน border-radius อัตโนมัติ
  box.frame.src = '';
  box.state = 'idle';
  box.icon = null;
  box.target = null;
  box.dragCurrentX = 0;
  box.dragCurrentY = 0;
  updateGlobalUI();
}

function forceResetBox(box) {
  if (box.rafId)     { cancelAnimationFrame(box.rafId); box.rafId = null; }
  if (box.openTimer) { clearTimeout(box.openTimer); box.openTimer = null; }
  box.el.style.display = 'none';
  box.el.style.transform = 'none';
  box.el.style.transition = 'none';
  box.el.classList.remove('passthrough');
  box.el.classList.remove('z-closing');
  box.el.classList.add('z-open');
  box.web.style.opacity = '1';
  box.web.style.borderRadius = '0px';
  box.web.style.background = '#fff';
  box.web.style.transition = 'none';
  box.pill.style.opacity = '1';
  if (box.icon) moveIconToDock(box.icon);
  box.frame.src = '';
  box.state = 'idle';
  box.icon = null;
  box.target = null;
  box.dragCurrentX = 0;
  box.dragCurrentY = 0;
  box.rafId = null;
  box.openTimer = null;
  updateGlobalUI();
}

// ═══════════════════════════════════════════════════════════
//  GESTURE BAR
// ═══════════════════════════════════════════════════════════

function startDrag(openBox, startX, startY) {
  activeDragBox = openBox;
  dragStartX = startX; dragStartY = startY;
  lastMoveX = startX; lastMoveY = startY;
  lastMoveTime = performance.now();
  velocityX = 0; velocityY = 0;
  openBox.state = 'dragging';
  openBox.dragCurrentX = 0;
  openBox.dragCurrentY = 0;
  appState = 'dragging';
  dockWrap.classList.remove('hidden');
  openBox.el.style.transition = 'none';
  openBox.web.style.transition = 'none';
}

function moveDrag(x, y) {
  if (!activeDragBox || activeDragBox.state !== 'dragging') return;
  const now = performance.now();
  const dt = now - lastMoveTime;
  if (dt > 0) {
    velocityX = (x - lastMoveX) / dt;
    velocityY = (y - lastMoveY) / dt;
  }
  lastMoveX = x; lastMoveY = y; lastMoveTime = now;

  const rawX = x - dragStartX;
  const rawY = y - dragStartY;
  const sticky = applySticky(rawX, rawY);
  activeDragBox.dragCurrentX = sticky.x;
  activeDragBox.dragCurrentY = sticky.y;

  const dist = Math.sqrt(sticky.x * sticky.x + sticky.y * sticky.y);
  const maxDim = Math.max(window.innerWidth, window.innerHeight);
  const progress = Math.min(dist / maxDim, 1);
  const scale = 1 - progress * DRAG_SHRINK;

  activeDragBox.el.style.transform = 'translate(' + sticky.x + 'px,' + sticky.y + 'px) scale(' + scale + ')';
  activeDragBox.web.style.borderRadius = calcRadius(progress, scale);
  bgOverlay.style.opacity = Math.max(0, 1 - progress * 2);
  if (activeDragBox.pill) activeDragBox.pill.style.opacity = Math.max(0, 1 - progress * 3);
}

function endDrag() {
  if (!activeDragBox || activeDragBox.state !== 'dragging') return;
  if (shouldClose()) {
    closeBox(activeDragBox);
  } else {
    activeDragBox.state = 'open';
    activeDragBox.el.style.transition = 'transform ' + SNAP_MS + 'ms cubic-bezier(0.16, 1, 0.3, 1)';
    activeDragBox.el.style.transform = 'none';
    activeDragBox.web.style.transition = 'border-radius ' + SNAP_MS + 'ms cubic-bezier(0.16, 1, 0.3, 1)';
    activeDragBox.web.style.borderRadius = '0px';
    bgOverlay.style.opacity = '';
    bgOverlay.classList.add('active');
    dockWrap.classList.add('hidden');
    activeDragBox.dragCurrentX = 0;
    activeDragBox.dragCurrentY = 0;
    if (activeDragBox.pill) activeDragBox.pill.style.opacity = '1';
    updateGlobalUI();
  }
  activeDragBox = null;
}

// Touch
gestureBar.addEventListener('touchstart', (e) => {
  const openBox = findOpenBox();
  if (!openBox) return;
  e.preventDefault(); e.stopPropagation();
  startDrag(openBox, e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

gestureBar.addEventListener('touchmove', (e) => {
  if (!activeDragBox || activeDragBox.state !== 'dragging') return;
  e.preventDefault(); e.stopPropagation();
  moveDrag(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

gestureBar.addEventListener('touchend', endDrag);

// Mouse
gestureBar.addEventListener('mousedown', (e) => {
  const openBox = findOpenBox();
  if (!openBox) return;
  e.preventDefault(); e.stopPropagation();
  startDrag(openBox, e.clientX, e.clientY);
});

document.addEventListener('mousemove', (e) => { moveDrag(e.clientX, e.clientY); });
document.addEventListener('mouseup', endDrag);

// ═══════════════════════════════════════════════════════════
//  ICON CLICK
// ═══════════════════════════════════════════════════════════

document.querySelectorAll('.app-icon').forEach(icon => {
  icon.addEventListener('click', () => {
    const url = APP_URLS[icon.id] || icon.dataset.url;
    openApp(icon, url);
  });
});

// ═══════════════════════════════════════════════════════════
//  BLOCK
// ═══════════════════════════════════════════════════════════

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());

// ═══════════════════════════════════════════════════════════
//  KIOSK MODE (ไม่มี pointer lock — ให้เมาส์ใช้ได้)
// ═══════════════════════════════════════════════════════════

let escPressed = false;

async function enterKiosk() {
  if (escPressed) return;
  if (!document.fullscreenElement) {
    try { await document.documentElement.requestFullscreen(); } catch(e) {}
  }
}

document.addEventListener('click', enterKiosk, { once: true });
document.addEventListener('touchend', enterKiosk, { once: true });

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && !escPressed) setTimeout(enterKiosk, 200);
  if (document.fullscreenElement) escPressed = false;
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    escPressed = true;
    if (document.fullscreenElement) document.exitFullscreen();
    return;
  }
  e.preventDefault();
});

history.pushState(null,'',location.href);
history.pushState(null,'',location.href);
history.pushState(null,'',location.href);
window.addEventListener('popstate', () => {
  history.pushState(null,'',location.href);
  enterKiosk();
});
</script>
