<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
<title>HyperOS Launcher</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
  font-family: -apple-system, "SF Pro Display", "Noto Sans SC", system-ui, sans-serif;
}
img.wallpaper {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover; object-position: center;
  user-select: none; -webkit-user-drag: none; pointer-events: none;
}
.bg-overlay {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.35); z-index: 15;
  opacity: 0; pointer-events: none; cursor: pointer;
  transition: opacity 0.5s ease;
}
.bg-overlay.active { opacity: 1; pointer-events: auto; }

/* ─── Dock ─── */
.dock-wrap {
  position: fixed; bottom: 68px; left: 50%;
  transform: translateX(-50%); z-index: 10;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.dock-wrap.hidden {
  opacity: 0; transform: translateX(-50%) translateY(30px); pointer-events: none;
}
.dock {
  display: flex; align-items: center; gap: 18px; padding: 13px;
  border-radius: 29px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-top-color: rgba(255,255,255,0.14);
  box-shadow: 0 8px 48px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.1);
  position: relative;
}
.dock::before {
  content: ''; position: absolute;
  top: -1px; left: 15%; right: 15%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
}

/* ─── App Icon (dock) ─── */
.app-icon {
  width: 52px; height: 52px; border-radius: 15px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative; overflow: hidden; flex-shrink: 0;
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.app-icon::after {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.04) 100%);
  border-radius: 15px 15px 0 0; pointer-events: none;
}
.app-icon svg { position: relative; z-index: 1; }

/* ─── BOX_anim ─── */
.box-anim {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  display: none; transform-origin: 0 0;
  will-change: transform;
}
.box-anim.passthrough { pointer-events: none; }
.box-anim.z-closing { z-index: 20; }
.box-anim.z-open    { z-index: 22; }

/* ─── Icon Layer — โคลนหน้าตา icon จาก dock ─── */
.icon-layer {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 4; pointer-events: none;
  opacity: 0; overflow: hidden;
  will-change: border-radius, opacity;
  display: flex; align-items: center; justify-content: center;
}
.icon-layer.visible { opacity: 1; }
.icon-layer svg {
  width: 52%; height: 52%;
  position: relative; z-index: 1;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
}
.icon-layer::after {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.04) 100%);
  pointer-events: none; z-index: 2;
}

/* ─── Box WEB ─── */
.box-web {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  background: #fff; overflow: hidden;
  will-change: border-radius; z-index: 2;
}
.box-web iframe {
  width: 100%; height: 100%; border: none; display: block;
}
.box-anim.passthrough .box-web,
.box-anim.passthrough iframe { pointer-events: none; }

/* ─── Gesture Pill ─── */
.box-gesture-pill {
  position: absolute; bottom: 12px; left: 50%;
  transform: translateX(-50%);
  width: 200px; height: 5px; border-radius: 3px;
  background: #fff; mix-blend-mode: difference;
  pointer-events: none; z-index: 5; opacity: 1;
}

/* ─── Gesture Bar ─── */
.gesture-bar {
  position: fixed; bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%; height: 60px;
  z-index: 50; touch-action: none; cursor: pointer;
}
</style>
</head>
<body>

<img class="wallpaper" src="https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/4b5d40216256937.67b492e0e7551.jpg" alt="">
<div class="bg-overlay" id="bgOverlay"></div>

<!-- BOX_anim A -->
<div class="box-anim z-open" id="boxAnim0">

    <iframe id="appFrame0" src="" allow="autoplay; fullscreen"></iframe>
  </div>

<div class="gesture-bar" id="gestureBar"></div>

<div class="dock-wrap" id="dockWrap">
  <div class="dock">
    <div class="app-icon" style="background:linear-gradient(145deg,#CFD8DC,#546E7A)" id="btnSettings">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="white" fill-opacity=".88"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg>

      <svg width="26" height="26" viewBox="0 0 24 24" fill="white" fill-opacity=".88"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7.5 4h5v2h-5V7zm0 4h5v2h-5v-2zM7 7h2v2H7V7zm0 4h2v2H7v-2zm0 4h2v2H7v-2zm4.5 0h5v2h-5v-2z"/></svg>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  APP URL MAP
// ═══════════════════════════════════════════════════════════
function appPage(title, bg, color) {
  return 'data:text/html;charset=utf-8,' + encodeURIComponent(
    '<html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head>' +
    '<body style="margin:0;padding:0;background:' + bg + ';display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif">' +
    '<p style="color:' + color + ';font-size:28px;font-weight:300">' + title + '</p></body></html>'
  );
}
const APP_URLS = {
  btnSettings: appPage('Settings', '#f5f5f5', 'rgba(0,0,0,0.12)'),
  btnYouTube:  appPage('YouTube',  '#0f0f0f', 'rgba(255,255,255,0.12)'),
  btnCamera:   appPage('Camera',   '#000000', 'rgba(255,255,255,0.08)'),
  btnCalc:     appPage('Calculator','#f0f0f0', 'rgba(0,0,0,0.12)'),
};

// ═══════════════════════════════════════════════════════════
//  BOX POOL
// ═══════════════════════════════════════════════════════════
const boxPool = [
  {
    idx: 0,
    el:    document.getElementById('boxAnim0'),
    web:   document.getElementById('boxWeb0'),
    frame: document.getElementById('appFrame0'),
    pill:  document.getElementById('boxPill0'),
    iconLayer: document.getElementById('iconLayer0'),
    state: 'idle',
    iconId: null,
    target: null,
    iconBg: null,
    iconSvg: null,
    rafId: null,
    openTimer: null,
    dragCurrentX: 0,
    dragCurrentY: 0,
  },
  {
    idx: 1,
    el:    document.getElementById('boxAnim1'),
    web:   document.getElementById('boxWeb1'),
    frame: document.getElementById('appFrame1'),
    pill:  document.getElementById('boxPill1'),
    iconLayer: document.getElementById('iconLayer1'),
    state: 'idle',
    iconId: null,
    target: null,
    iconBg: null,
    iconSvg: null,
    rafId: null,
    openTimer: null,
    dragCurrentX: 0,
    dragCurrentY: 0,
  }
];

// ─── Global State ───
let appState = 'closed';
const gestureBar = document.getElementById('gestureBar');
const dockWrap   = document.getElementById('dockWrap');
const bgOverlay  = document.getElementById('bgOverlay');

let dragStartX = 0, dragStartY = 0;
let lastMoveX = 0, lastMoveY = 0, lastMoveTime = 0;
let velocityX = 0, velocityY = 0;
let activeDragBox = null;

// ─── Tuning ───
const R_ICON = 15;
const CLOSE_UP_PX = Math.round(window.innerHeight * 0.08);
const OPEN_MS = 370;
const SNAP_MS = 370;
const VELOCITY_CLOSE = 0.35;
const SPEED = 4.5;
const FLING = 1.8;
const DRAG_SHRINK = 0.30;

// ═══════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════

function getIconTransform(iconRect) {
  const W = window.innerWidth, H = window.innerHeight;
  const sx = iconRect.width / W, sy = iconRect.height / H;
  const tx = iconRect.left + iconRect.width / 2 - W * sx / 2;
  const ty = iconRect.top + iconRect.height / 2 - H * sy / 2;
  return { tx, ty, sx, sy };
}

function calcRadiusXY(progress, sx, sy) {
  const v = progress * R_ICON;
  return (v / Math.max(0.01, sx)) + 'px / ' + (v / Math.max(0.01, sy)) + 'px';
}

function calcRadius(progress, scale) {
  return (progress * R_ICON) / Math.max(0.01, scale) + 'px';
}

function shouldClose() {
  if (activeDragBox && activeDragBox.dragCurrentY < -CLOSE_UP_PX) return true;
  if (velocityY < -VELOCITY_CLOSE) return true;
  return false;
}

function applySticky(rawX, rawY) {
  const H = window.innerHeight, W = window.innerWidth;
  const FREE_ZONE_Y = H * 0.40, DIM_Y = H * 0.2;
  let sy = rawY;
  if (rawY < 0) {
    const absY = Math.abs(rawY);
    if (absY <= FREE_ZONE_Y) sy = rawY;
    else { const ex = absY - FREE_ZONE_Y; sy = -(FREE_ZONE_Y + DIM_Y * (1 - 1/(1+ex/DIM_Y))); }
  }
  const FREE_ZONE_X = W * 0.1, DIM_X = W * 0.4;
  let sx = rawX;
  const absX = Math.abs(rawX);
  if (absX > FREE_ZONE_X) {
    const ex = absX - FREE_ZONE_X;
    const c = FREE_ZONE_X + DIM_X * (1 - 1/(1+ex/DIM_X));
    sx = rawX > 0 ? c : -c;
  }
  return { x: sx, y: sy };
}

function easeOutSmooth(t) { return 1 - Math.pow(1 - t, 2.8); }

// ★ หา box ที่เปิดอยู่ (open เท่านั้น)
function findOpenBox()  { return boxPool.find(b => b.state === 'open') || null; }
// ★ หา box ที่กำลังทำอะไรอยู่ (open + opening + dragging) — ใช้ตอนกดปิด
function findActiveBox() { return boxPool.find(b => b.state === 'open' || b.state === 'opening' || b.state === 'dragging') || null; }
function findIdleBox()  { return boxPool.find(b => b.state === 'idle') || null; }

function updateGlobalUI() {
  const hasOpen = boxPool.some(b => b.state === 'open');
  const hasBusy = boxPool.some(b => b.state === 'opening' || b.state === 'closing');
  const hideDock = hasOpen || boxPool.some(b => b.state === 'opening');
  dockWrap.classList.toggle('hidden', hideDock);
  if (hideDock) { bgOverlay.classList.add('active'); bgOverlay.style.opacity = ''; }
  else { bgOverlay.classList.remove('active'); bgOverlay.style.opacity = ''; }
  if (hasOpen) appState = 'open';
  else if (hasBusy) appState = 'transitioning';
  else appState = 'closed';
}

function hideDockIcon(id) {
  const el = document.getElementById(id);
  if (el) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; }
}
function showDockIcon(id) {
  const el = document.getElementById(id);
  if (el) { el.style.opacity = ''; el.style.pointerEvents = ''; }
}

function setupIconLayer(box, iconEl) {
  const layer = box.iconLayer;
  layer.innerHTML = iconEl.innerHTML;
  layer.style.background = iconEl.style.background || getComputedStyle(iconEl).background;
}

// ═══════════════════════════════════════════════════════════
//  OPEN APP
// ═══════════════════════════════════════════════════════════

function openApp(iconEl, url) {
  const iconId = iconEl.id;

  // ★ กด icon เดียวกัน → ปิด (แม้ตอน opening)
  const activeBox = findActiveBox();
  if (activeBox && activeBox.iconId === iconId) { closeBox(activeBox); return; }

  boxPool.forEach(b => { if (b.state !== 'idle') forceResetBox(b); });

  const box = findIdleBox();
  if (!box) return;

  void document.body.offsetHeight;
  const iconRect = iconEl.getBoundingClientRect();
  const iconTf = getIconTransform(iconRect);
  const iconBg = iconEl.style.background || getComputedStyle(iconEl).background;

  box.target  = iconTf;
  box.iconId  = iconId;
  box.iconBg  = iconBg;
  box.iconSvg = iconEl.innerHTML;

  hideDockIcon(iconId);
  setupIconLayer(box, iconEl);

  box.el.style.display = 'block';
  box.el.style.transition = 'none';
  box.web.style.transition = 'none';
  box.el.style.transform = 'translate(' + iconTf.tx + 'px,' + iconTf.ty + 'px) scale(' + iconTf.sx + ',' + iconTf.sy + ')';
  box.el.classList.remove('passthrough');
  box.el.classList.remove('z-closing');
  box.el.classList.add('z-open');

  const startR = calcRadiusXY(1, iconTf.sx, iconTf.sy);
  box.iconLayer.classList.add('visible');
  box.iconLayer.style.borderRadius = startR;
  box.web.style.borderRadius = startR;
  box.web.style.background = 'transparent';
  box.web.style.opacity = '1';
  box.pill.style.opacity = '0';

  box.frame.src = '';
  void box.el.offsetHeight;

  box.state = 'opening';
  const startTime = performance.now();
  const fromTx = iconTf.tx, fromTy = iconTf.ty;
  const fromSx = iconTf.sx, fromSy = iconTf.sy;
  let iconFaded = false;

  function tickOpen(now) {
    if (box.state !== 'opening') return;

    const elapsed = now - startTime;
    let t = Math.min(elapsed / OPEN_MS, 1);
    const et = easeOutSmooth(t);

    const curSx = fromSx + (1 - fromSx) * et;
    const curSy = fromSy + (1 - fromSy) * et;
    const curTx = fromTx * (1 - et);
    const curTy = fromTy * (1 - et);

    const radiusProgress = Math.pow(1 - et, 0.65);
    const cssR = calcRadiusXY(radiusProgress, curSx, curSy);
    box.web.style.borderRadius = cssR;
    box.iconLayer.style.borderRadius = cssR;

    box.el.style.transform = 'translate(' + curTx + 'px,' + curTy + 'px) scale(' + curSx + ',' + curSy + ')';

    if (!iconFaded && t > 0.25) {
      iconFaded = true;
      box.iconLayer.classList.remove('visible');
      box.web.style.background = '#fff';
      box.pill.style.opacity = '1';
    }

    if (t < 1) {
      box.rafId = requestAnimationFrame(tickOpen);
    } else {
      box.el.style.transform = 'none';
      box.web.style.borderRadius = '0px';
      box.iconLayer.classList.remove('visible');
      box.state = 'open';
      box.rafId = null;
      updateGlobalUI();
    }
  }

  box.rafId = requestAnimationFrame(tickOpen);

  if (box.openTimer) clearTimeout(box.openTimer);
  box.openTimer = setTimeout(() => { box.frame.src = url; box.openTimer = null; }, 80);

  box.dragCurrentX = 0;
  box.dragCurrentY = 0;
  updateGlobalUI();
}

// ═══════════════════════════════════════════════════════════
//  CLOSE BOX — spring animation
// ═══════════════════════════════════════════════════════════

function closeBox(box) {
  if (box.state !== 'open' && box.state !== 'opening' && box.state !== 'dragging') return;
  box.state = 'closing';

  if (box.openTimer) { clearTimeout(box.openTimer); box.openTimer = null; }
  if (box.rafId)     { cancelAnimationFrame(box.rafId); box.rafId = null; }

  const W = window.innerWidth, H = window.innerHeight;

  const rect = box.el.getBoundingClientRect();
  const startTx = rect.left, startTy = rect.top;
  const startSx = rect.width / W, startSy = rect.height / H;

  box.el.style.transition = 'none';
  box.web.style.transition = 'none';
  box.el.style.transform = 'translate(' + startTx + 'px,' + startTy + 'px) scale(' + startSx + ',' + startSy + ')';

  const target = box.target;
  if (!target) { finishBoxClose(box); return; }

  const tTx = target.tx, tTy = target.ty, tSx = target.sx, tSy = target.sy;

  let p = 0, pVel = 5 * SPEED;
  let oY = 0;
  const swipeSpeed = Math.sqrt(velocityX * velocityX + velocityY * velocityY);
  const flingHeight = FLING * (Math.max(swipeSpeed, 0.05) * 0.5 + 0.06) * H;
  let oYVel = -4 * FLING;

  const pStiff = 22 * SPEED * SPEED, pDamp = 11 * SPEED;
  const oStiff = 25 * SPEED * SPEED, oDamp = 12 * SPEED;

  box.el.classList.add('passthrough');
  box.el.classList.remove('z-open');
  box.el.classList.add('z-closing');

  box.iconLayer.innerHTML = box.iconSvg;
  box.iconLayer.style.background = box.iconBg;

  let totalMs = 0, maxMs = 700, lastTs = null;
  let settled = false, iconShown = false;

  function tick(ts) {
    if (!lastTs) lastTs = ts;
    const frameMs = Math.min(ts - lastTs, 32);
    lastTs = ts; totalMs += frameMs;
    if (totalMs > maxMs) { finishBoxClose(box); return; }

    const steps = Math.max(1, Math.round(frameMs / 4));
    const dt = (frameMs / 1000) / steps;
    for (let i = 0; i < steps; i++) {
      const fp = -pStiff * (p - 1) - pDamp * pVel;
      pVel += fp * dt; p += pVel * dt;
      const fo = -oStiff * oY - oDamp * oYVel;
      oYVel += fo * dt; oY += oYVel * dt;
    }
    p = Math.max(0, Math.min(1.02, p));

    const curTx = startTx + (tTx - startTx) * p;
    const curTy = startTy + (tTy - startTy) * p + oY * flingHeight;
    const curSx = startSx + (tSx - startSx) * p;
    const curSy = startSy + (tSy - startSy) * p;

    const clampSx = Math.max(tSx * 0.5, Math.min(1.1, curSx));
    const clampSy = Math.max(tSy * 0.5, Math.min(1.1, curSy));

    const sizeProgress = Math.max(0, Math.min(1, (1 - Math.min(clampSx, clampSy)) / (1 - Math.min(tSx, tSy))));

    const radiusProgress = Math.pow(sizeProgress, 0.65);
    const cssR = calcRadiusXY(radiusProgress, clampSx, clampSy);

    if (!iconShown && sizeProgress > 0.55) {
      iconShown = true;
      box.iconLayer.classList.add('visible');
      box.web.style.background = 'transparent';
    }
    if (iconShown) {
      box.iconLayer.style.borderRadius = cssR;
    }

    if (box.pill) box.pill.style.opacity = Math.max(0, 1 - sizeProgress * 2.5);

    box.el.style.transform = 'translate(' + curTx + 'px,' + curTy + 'px) scale(' + clampSx + ',' + clampSy + ')';
    box.web.style.borderRadius = cssR;

    const pDist = Math.abs(p - 1);
    const oYAbs = Math.abs(oY);
    const oYVelAbs = Math.abs(oYVel);

    if (!settled && pDist < 0.008 && oYAbs < 0.03 && oYVelAbs < 0.3) {
      settled = true;
      const finalR = calcRadiusXY(1, tSx, tSy);
      box.el.style.transition = 'transform 120ms cubic-bezier(0.25, 0, 0.15, 1)';
      box.el.style.transform = 'translate(' + tTx + 'px,' + tTy + 'px) scale(' + tSx + ',' + tSy + ')';
      box.web.style.transition = 'border-radius 120ms cubic-bezier(0.25, 0, 0.15, 1), opacity 120ms ease';
      box.web.style.borderRadius = finalR;
      box.web.style.opacity = '0';
      box.iconLayer.style.borderRadius = finalR;
      setTimeout(() => finishBoxClose(box), 130);
      return;
    }

    box.rafId = requestAnimationFrame(tick);
  }

  box.rafId = requestAnimationFrame(tick);
  updateGlobalUI();
}

function finishBoxClose(box) {
  if (box.rafId) { cancelAnimationFrame(box.rafId); box.rafId = null; }
  box.el.style.display = 'none';
  box.el.style.transform = 'none';
  box.el.style.transition = 'none';
  box.el.classList.remove('passthrough');
  box.el.classList.remove('z-closing');
  box.el.classList.add('z-open');
  box.web.style.opacity = '1';
  box.web.style.borderRadius = '0px';
  box.web.style.background = '#fff';
  box.web.style.transition = 'none';
  box.iconLayer.classList.remove('visible');
  box.iconLayer.innerHTML = '';
  box.pill.style.opacity = '1';
  if (box.iconId) showDockIcon(box.iconId);
  box.frame.src = '';
  box.state = 'idle';
  box.iconId = null;
  box.target = null;
  box.iconBg = null;
  box.iconSvg = null;
  box.dragCurrentX = 0;
  box.dragCurrentY = 0;
  updateGlobalUI();
}

function forceResetBox(box) {
  if (box.rafId)     { cancelAnimationFrame(box.rafId); box.rafId = null; }
  if (box.openTimer) { clearTimeout(box.openTimer); box.openTimer = null; }
  box.el.style.display = 'none';
  box.el.style.transform = 'none';
  box.el.style.transition = 'none';
  box.el.classList.remove('passthrough');
  box.el.classList.remove('z-closing');
  box.el.classList.add('z-open');
  box.web.style.opacity = '1';
  box.web.style.borderRadius = '0px';
  box.web.style.background = '#fff';
  box.web.style.transition = 'none';
  box.iconLayer.classList.remove('visible');
  box.iconLayer.innerHTML = '';
  box.pill.style.opacity = '1';
  if (box.iconId) showDockIcon(box.iconId);
  box.frame.src = '';
  box.state = 'idle';
  box.iconId = null;
  box.target = null;
  box.iconBg = null;
  box.iconSvg = null;
  box.dragCurrentX = 0;
  box.dragCurrentY = 0;
  box.rafId = null;
  box.openTimer = null;
  updateGlobalUI();
}

// ═══════════════════════════════════════════════════════════
//  GESTURE
// ═══════════════════════════════════════════════════════════

function startDrag(openBox, startX, startY) {
  activeDragBox = openBox;
  dragStartX = startX; dragStartY = startY;
  lastMoveX = startX; lastMoveY = startY;
  lastMoveTime = performance.now();
  velocityX = 0; velocityY = 0;
  openBox.state = 'dragging';
  openBox.dragCurrentX = 0;
  openBox.dragCurrentY = 0;
  appState = 'dragging';
  dockWrap.classList.remove('hidden');
  openBox.el.style.transition = 'none';
  openBox.web.style.transition = 'none';
}

function moveDrag(x, y) {
  if (!activeDragBox || activeDragBox.state !== 'dragging') return;
  const now = performance.now();
  const dt = now - lastMoveTime;
  if (dt > 0) { velocityX = (x - lastMoveX) / dt; velocityY = (y - lastMoveY) / dt; }
  lastMoveX = x; lastMoveY = y; lastMoveTime = now;

  const rawX = x - dragStartX, rawY = y - dragStartY;
  const sticky = applySticky(rawX, rawY);
  activeDragBox.dragCurrentX = sticky.x;
  activeDragBox.dragCurrentY = sticky.y;

  const dist = Math.sqrt(sticky.x * sticky.x + sticky.y * sticky.y);
  const maxDim = Math.max(window.innerWidth, window.innerHeight);
  const progress = Math.min(dist / maxDim, 1);
  const scale = 1 - progress * DRAG_SHRINK;

  activeDragBox.el.style.transform = 'translate(' + sticky.x + 'px,' + sticky.y + 'px) scale(' + scale + ')';
  activeDragBox.web.style.borderRadius = calcRadius(progress, scale);
  bgOverlay.style.opacity = Math.max(0, 1 - progress * 2);
  if (activeDragBox.pill) activeDragBox.pill.style.opacity = Math.max(0, 1 - progress * 3);
}

function endDrag() {
  if (!activeDragBox || activeDragBox.state !== 'dragging') return;
  if (shouldClose()) {
    closeBox(activeDragBox);
  } else {
    activeDragBox.state = 'open';
    activeDragBox.el.style.transition = 'transform ' + SNAP_MS + 'ms cubic-bezier(0.16, 1, 0.3, 1)';
    activeDragBox.el.style.transform = 'none';
    activeDragBox.web.style.transition = 'border-radius ' + SNAP_MS + 'ms cubic-bezier(0.16, 1, 0.3, 1)';
    activeDragBox.web.style.borderRadius = '0px';
    activeDragBox.web.style.background = '#fff';
    bgOverlay.style.opacity = '';
    bgOverlay.classList.add('active');
    dockWrap.classList.add('hidden');
    activeDragBox.dragCurrentX = 0;
    activeDragBox.dragCurrentY = 0;
    if (activeDragBox.pill) activeDragBox.pill.style.opacity = '1';
    updateGlobalUI();
  }
  activeDragBox = null;
}

// Touch — ★ ใช้ findActiveBox แทน findOpenBox ให้กดปิดได้แม้ตอน opening
gestureBar.addEventListener('touchstart', (e) => {
  const activeBox = findActiveBox();
  if (!activeBox) return;
  e.preventDefault(); e.stopPropagation();
  startDrag(activeBox, e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
gestureBar.addEventListener('touchmove', (e) => {
  if (!activeDragBox || activeDragBox.state !== 'dragging') return;
  e.preventDefault(); e.stopPropagation();
  moveDrag(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });
gestureBar.addEventListener('touchend', endDrag);

// Mouse — ★ ใช้ findActiveBox แทน findOpenBox
let mouseDownPos = null;
gestureBar.addEventListener('mousedown', (e) => {
  const activeBox = findActiveBox();
  if (!activeBox) return;
  e.preventDefault(); e.stopPropagation();
  mouseDownPos = { x: e.clientX, y: e.clientY };
  startDrag(activeBox, e.clientX, e.clientY);
});
document.addEventListener('mousemove', (e) => { moveDrag(e.clientX, e.clientY); });
document.addEventListener('mouseup', (e) => {
  if (!activeDragBox) { mouseDownPos = null; return; }
  if (mouseDownPos) {
    const dx = e.clientX - mouseDownPos.x, dy = e.clientY - mouseDownPos.y;
    if (Math.sqrt(dx*dx + dy*dy) < 10) velocityY = -1;
  }
  mouseDownPos = null;
  endDrag();
});

bgOverlay.addEventListener('click', () => {
  const activeBox = findActiveBox();
  if (activeBox) closeBox(activeBox);
});

// ═══════════════════════════════════════════════════════════
//  ICON CLICK
// ═══════════════════════════════════════════════════════════
document.querySelectorAll('.app-icon').forEach(icon => {
  icon.addEventListener('click', () => {
    openApp(icon, APP_URLS[icon.id] || icon.dataset.url);
  });
});

document.addEventListener('dblclick', e => e.preventDefault());

document.addEventListener('selectstart', e => e.preventDefault());

// ═══════════════════════════════════════════════════════════
//  KIOSK MODE
// ═══════════════════════════════════════════════════════════
let escPressed = false;
async function enterKiosk() {
  if (escPressed) return;
  if (!document.fullscreenElement) {
    try { await document.documentElement.requestFullscreen(); } catch(e) {}
  }
}
document.addEventListener('click', enterKiosk, { once: true });
document.addEventListener('touchend', enterKiosk, { once: true });
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && !escPressed) setTimeout(enterKiosk, 200);
  if (document.fullscreenElement) escPressed = false;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { escPressed = true; if (document.fullscreenElement) document.exitFullscreen(); return; }
  e.preventDefault();
});
history.pushState(null,'',location.href);
history.pushState(null,'',location.href);
history.pushState(null,'',location.href);
window.addEventListener('popstate', () => { history.pushState(null,'',location.href); enterKiosk(); });
</script>
