<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
<title>HyperOS Launcher</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
  font-family: -apple-system, "SF Pro Display", "Noto Sans SC", system-ui, sans-serif;
}

/* ─── Wallpaper ─── */
img.wallpaper {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* ─── Background Overlay (dim when app open) ─── */
.bg-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.35);
  z-index: 15;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}
.bg-overlay.active { opacity: 1; }

/* ─── Dock ─── */
.dock-wrap {
  position: fixed;
  bottom: 58px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  transition: opacity 0.45s ease, transform 0.45s ease;
}
.dock-wrap.hidden {
  opacity: 0;
  transform: translateX(-50%) translateY(30px);
  pointer-events: none;
}
.dock {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 13px 13px;
  border-radius: 29px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-top-color: rgba(255,255,255,0.14);
  box-shadow: 0 8px 48px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.1);
  position: relative;
}
.dock::before {
  content: '';
  position: absolute;
  top: -1px; left: 15%; right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
}

/* ─── App Icon ─── */
.app-icon {
  width: 52px; height: 52px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s ease;
  position: relative;
  overflow: hidden;
}
.app-icon:active { transform: scale(0.88); }
.app-icon::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.04) 100%);
  border-radius: 13px 13px 0 0;
  pointer-events: none;
}
.app-icon svg { position: relative; z-index: 1; }

/* ─── Box WEB ─── */
.box-web {
  position: fixed;
  z-index: 20;
  display: none;
  background: #fff;
  overflow: hidden;
  will-change: transform, left, top, width, height, border-radius;
}
.box-web.passthrough {
  pointer-events: none;
}
.box-web iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
.box-web.passthrough iframe {
  pointer-events: none;
}

/* ─── Single Topmost Gesture Bar ─── */
.gesture-bar {
  position: fixed;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 160px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  touch-action: none;
  cursor: grab;
}
.gesture-bar:active { cursor: grabbing; }
.gesture-pill {
  width: 134px;
  height: 5px;
  border-radius: 3px;
  background: rgba(255,255,255,0.35);
  transition: background 0.4s ease, width 0.15s ease;
  pointer-events: none;
}
.gesture-bar:active .gesture-pill {
  width: 110px;
}
/* Dark pill when app is open (on white bg) */
.gesture-bar.on-app .gesture-pill {
  background: rgba(0,0,0,0.18);
}
.gesture-bar.on-app:active .gesture-pill {
  background: rgba(0,0,0,0.35);
}
</style>
</head>
<body>

<img class="wallpaper" src="https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/4b5d40216256937.67b492e0e7551.jpg" alt="">

<!-- Background Overlay -->
<div class="bg-overlay" id="bgOverlay"></div>

<!-- Box WEB -->
<div class="box-web" id="boxWeb">
  <iframe id="appFrame" src="" allow="autoplay; fullscreen"></iframe>
</div>

<!-- Single Topmost Gesture Bar -->
<div class="gesture-bar" id="gestureBar">
  <div class="gesture-pill"></div>
</div>

<!-- Dock -->
<div class="dock-wrap" id="dockWrap">
  <div class="dock">
    <!-- Settings -->
    <div class="app-icon" style="background: linear-gradient(145deg, #CFD8DC, #546E7A);" id="btnSettings">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="white" fill-opacity=".88">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/>
      </svg>
    </div>
    <!-- YouTube -->
    <div class="app-icon" style="background: linear-gradient(145deg, #EF9A9A, #C62828);" id="btnYouTube">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="white" fill-opacity=".9">
        <path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/>
      </svg>
    </div>
  </div>
</div>

<script>
// ─── App State ───
let appState = 'closed'; // closed | opening | open | dragging | closing
let lastIconEl = null;
let pendingUrl = '';
let dragStartX = 0;
let dragStartY = 0;
let dragCurrentX = 0;
let dragCurrentY = 0;
let openTimer = null;
let closeTimer = null;
let closeRafId = null;

// Velocity tracking
let lastMoveX = 0, lastMoveY = 0, lastMoveTime = 0;
let velocityX = 0, velocityY = 0;

const boxWeb = document.getElementById('boxWeb');
const appFrame = document.getElementById('appFrame');
const gestureBar = document.getElementById('gestureBar');
const dockWrap = document.getElementById('dockWrap');
const bgOverlay = document.getElementById('bgOverlay');

// ─── Animation Tuning ───
const CLOSE_UP_PX = 50;
const OPEN_MS = 550;
const SNAP_MS = 550;
const VELOCITY_CLOSE = 0.35;  // px/ms upward = close on fast flick

// ─── Easing Curves ───
const EASE_OUT_SMOOTH = 'cubic-bezier(0.16, 1, 0.3, 1)';  // fast start → slow settle, NO overshoot

// ─── Helper: Get box current visual rect ───
function getBoxVisualRect() {
  const style = window.getComputedStyle(boxWeb);
  const left = parseFloat(boxWeb.style.left) || 0;
  const top = parseFloat(boxWeb.style.top) || 0;
  const width = parseFloat(boxWeb.style.width) || 0;
  const height = parseFloat(boxWeb.style.height) || 0;
  const tx = dragCurrentX || 0;
  const ty = dragCurrentY || 0;
  const transform = style.transform;
  let scale = 1;
  if (transform && transform !== 'none') {
    const m = transform.match(/scale\(([^)]+)\)/);
    if (m) scale = parseFloat(m[1]);
  }
  const sw = width * scale;
  const sh = height * scale;
  return {
    left: left + (width - sw) / 2 + tx,
    top: top + (height - sh) / 2 + ty,
    width: sw,
    height: sh
  };
}

// ─── Helper: Should close? (distance or velocity) ───
function shouldClose() {
  if (dragCurrentY < -CLOSE_UP_PX) return true;
  if (velocityY < -VELOCITY_CLOSE) return true;
  return false;
}

// ─── Helper: Update gesture bar color based on state ───
function updateGestureStyle() {
  if (appState === 'closed') {
    gestureBar.classList.remove('on-app');
  } else {
    gestureBar.classList.add('on-app');
  }
}

// ─── Open App ───
function openApp(iconEl, url) {
  if (appState === 'opening' && lastIconEl === iconEl) return;
  if (appState === 'open' && lastIconEl === iconEl) return;

  if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
  if (closeRafId) { cancelAnimationFrame(closeRafId); closeRafId = null; }

  const W = window.innerWidth;
  const H = window.innerHeight;
  const rect = iconEl.getBoundingClientRect();

  // ── Interrupt closing/dragging: morph from current position ──
  if (appState === 'closing' || appState === 'dragging') {
    const vr = getBoxVisualRect();

    boxWeb.style.transition = 'none';
    boxWeb.style.transform = 'none';
    boxWeb.style.left = vr.left + 'px';
    boxWeb.style.top = vr.top + 'px';
    boxWeb.style.width = vr.width + 'px';
    boxWeb.style.height = vr.height + 'px';
    boxWeb.style.borderRadius = boxWeb.style.borderRadius || '15px';
    boxWeb.style.opacity = '1';

    void boxWeb.offsetHeight;

    lastIconEl = iconEl;
    pendingUrl = url;

    dockWrap.classList.add('hidden');
    bgOverlay.classList.add('active');
    bgOverlay.style.opacity = '';
    boxWeb.classList.remove('passthrough');

    // Open: smooth ease-out, NO bounce
    boxWeb.style.transition = `all ${OPEN_MS}ms ${EASE_OUT_SMOOTH}`;
    boxWeb.style.left = '0px';
    boxWeb.style.top = '0px';
    boxWeb.style.width = W + 'px';
    boxWeb.style.height = H + 'px';
    boxWeb.style.borderRadius = '0px';

    appState = 'open';
    dragCurrentX = 0;
    dragCurrentY = 0;
    updateGestureStyle();

    if (openTimer) clearTimeout(openTimer);
    openTimer = setTimeout(() => {
      appFrame.src = url;
      openTimer = null;
    }, 100);

    if (document.pointerLockElement) document.exitPointerLock();
    return;
  }

  // ── Normal open from closed ──
  lastIconEl = iconEl;
  pendingUrl = url;

  boxWeb.style.transition = 'none';
  boxWeb.style.transform = 'none';
  boxWeb.style.display = 'block';
  boxWeb.classList.remove('passthrough');
  boxWeb.style.left = rect.left + 'px';
  boxWeb.style.top = rect.top + 'px';
  boxWeb.style.width = rect.width + 'px';
  boxWeb.style.height = rect.height + 'px';
  boxWeb.style.borderRadius = '15px';
  boxWeb.style.opacity = '1';

  appFrame.src = '';
  void boxWeb.offsetHeight;

  dockWrap.classList.add('hidden');
  bgOverlay.classList.add('active');

  // Open: smooth ease-out, NO bounce — fast start, slow settle
  boxWeb.style.transition = `all ${OPEN_MS}ms ${EASE_OUT_SMOOTH}`;
  boxWeb.style.left = '0px';
  boxWeb.style.top = '0px';
  boxWeb.style.width = W + 'px';
  boxWeb.style.height = H + 'px';
  boxWeb.style.borderRadius = '0px';

  appState = 'open';
  dragCurrentX = 0;
  dragCurrentY = 0;
  updateGestureStyle();

  if (openTimer) clearTimeout(openTimer);
  openTimer = setTimeout(() => {
    appFrame.src = url;
    openTimer = null;
  }, 100);

  if (document.pointerLockElement) document.exitPointerLock();
}

// ─── Close App (Spring Physics — แรงเวี่ยง) ───
function closeApp() {
  if (appState !== 'dragging' && appState !== 'open') return;
  appState = 'closing';

  if (openTimer)  { clearTimeout(openTimer);  openTimer = null; }
  if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
  if (closeRafId) { cancelAnimationFrame(closeRafId); closeRafId = null; }

  const iconRect = lastIconEl.getBoundingClientRect();
  const W = window.innerWidth;
  const H = window.innerHeight;

  // ── Current visual state (convert transform → absolute) ──
  const dist = Math.sqrt(dragCurrentX * dragCurrentX + dragCurrentY * dragCurrentY);
  const maxDim = Math.max(W, H);
  const progress = Math.min(dist / maxDim, 1);
  const scale = 1 - progress * 0.15;

  const startLeft   = (W - W * scale) / 2 + dragCurrentX;
  const startTop    = (H - H * scale) / 2 + dragCurrentY;
  const startWidth  = W * scale;
  const startHeight = H * scale;
  const startRadius = progress * 30;

  // Freeze
  boxWeb.style.transition   = 'none';
  boxWeb.style.transform    = 'none';
  boxWeb.style.left         = startLeft + 'px';
  boxWeb.style.top          = startTop + 'px';
  boxWeb.style.width        = startWidth + 'px';
  boxWeb.style.height       = startHeight + 'px';
  boxWeb.style.borderRadius = startRadius + 'px';
  void boxWeb.offsetHeight;

  // ── Spring: center position ──
  let cx = startLeft + startWidth / 2;
  let cy = startTop  + startHeight / 2;

  // Target center (icon)
  const tx = iconRect.left + iconRect.width / 2;
  const ty = iconRect.top  + iconRect.height / 2;

  // Direction to target
  const dx = tx - cx;
  const dy = ty - cy;
  const distToTarget = Math.sqrt(dx * dx + dy * dy);

  // ── Swipe speed → initial velocity in SWIPE direction (แรงเวี่ยง) ──
  // ปัดขึ้นเร็ว = momentum ขึ้นบน → กล่องบินขึ้น → สปริงดึงกลับลงไอคอน → เด้งสลับ
  const swipeSpeed = Math.sqrt(velocityX * velocityX + velocityY * velocityY);
  let vx = 0, vy = 0;
  if (swipeSpeed > 0.15) {
    const momentum = swipeSpeed * 2800;
    vx = velocityX * momentum / swipeSpeed;  // swipe direction X
    vy = velocityY * momentum / swipeSpeed;  // swipe direction Y
  }

  // Spring config: underdamped = มีเวี่ยง + เด้งสลับ
  const stiffness = 160;
  const damping   = 10;

  // UI
  boxWeb.classList.add('passthrough');
  dockWrap.classList.remove('hidden');
  bgOverlay.classList.remove('active');
  bgOverlay.style.opacity = '';

  let totalMs = 0;
  const maxMs = 900;
  let lastTs = null;

  function tick(ts) {
    if (!lastTs) lastTs = ts;
    const frameMs = Math.min(ts - lastTs, 32);
    lastTs = ts;
    totalMs += frameMs;

    if (totalMs > maxMs) { finishClose(); return; }

    // ── Spring sub-steps for stability ──
    const steps = Math.max(1, Math.round(frameMs / 4));
    const dt = (frameMs / 1000) / steps;
    for (let i = 0; i < steps; i++) {
      const fx = -stiffness * (cx - tx) - damping * vx;
      const fy = -stiffness * (cy - ty) - damping * vy;
      vx += fx * dt;
      vy += fy * dt;
      cx += vx * dt;
      cy += vy * dt;
    }

    // ── Size: smooth ease-out (NO overshoot on size) ──
    const sizeT = 1 - Math.pow(1 - Math.min(totalMs / 450, 1), 3);
    const curW = startWidth  + (iconRect.width  - startWidth)  * sizeT;
    const curH = startHeight + (iconRect.height - startHeight) * sizeT;
    const curR = startRadius + (15 - startRadius) * sizeT;
    const curO = 1 - sizeT * 0.65;

    // ── Apply ──
    boxWeb.style.left         = (cx - curW / 2) + 'px';
    boxWeb.style.top          = (cy - curH / 2) + 'px';
    boxWeb.style.width        = curW + 'px';
    boxWeb.style.height       = curH + 'px';
    boxWeb.style.borderRadius = curR + 'px';
    boxWeb.style.opacity      = curO;

    // ── Settled? ──
    const posDist = Math.sqrt((cx - tx) ** 2 + (cy - ty) ** 2);
    const vel     = Math.sqrt(vx * vx + vy * vy);
    if (posDist < 0.5 && vel < 8 && sizeT >= 1) {
      finishClose();
      return;
    }

    closeRafId = requestAnimationFrame(tick);
  }

  function finishClose() {
    if (closeRafId) { cancelAnimationFrame(closeRafId); closeRafId = null; }
    boxWeb.style.display      = 'none';
    boxWeb.style.opacity      = '1';
    boxWeb.style.transform    = 'none';
    boxWeb.classList.remove('passthrough');
    appFrame.src = '';
    dragCurrentX = 0;
    dragCurrentY = 0;
    velocityX = 0;
    velocityY = 0;
    appState = 'closed';
    closeTimer = null;
    updateGestureStyle();
    enterKiosk();
  }

  closeRafId = requestAnimationFrame(tick);
}

// ─── Gesture Bar: Touch Events ───
gestureBar.addEventListener('touchstart', (e) => {
  if (appState !== 'open' && appState !== 'opening') return;
  e.preventDefault();
  e.stopPropagation();

  dragStartX = e.touches[0].clientX;
  dragStartY = e.touches[0].clientY;
  lastMoveX = dragStartX;
  lastMoveY = dragStartY;
  lastMoveTime = performance.now();
  dragCurrentX = 0;
  dragCurrentY = 0;
  velocityX = 0;
  velocityY = 0;
  appState = 'dragging';

  dockWrap.classList.remove('hidden');
  boxWeb.style.transition = 'none';
}, { passive: false });

gestureBar.addEventListener('touchmove', (e) => {
  if (appState !== 'dragging') return;
  e.preventDefault();
  e.stopPropagation();

  const now = performance.now();
  const x = e.touches[0].clientX;
  const y = e.touches[0].clientY;

  const dt = now - lastMoveTime;
  if (dt > 0) {
    velocityX = (x - lastMoveX) / dt;
    velocityY = (y - lastMoveY) / dt;
  }
  lastMoveX = x;
  lastMoveY = y;
  lastMoveTime = now;

  dragCurrentX = x - dragStartX;
  dragCurrentY = y - dragStartY;

  const dist = Math.sqrt(dragCurrentX * dragCurrentX + dragCurrentY * dragCurrentY);
  const maxDim = Math.max(window.innerWidth, window.innerHeight);
  const progress = Math.min(dist / maxDim, 1);
  const scale = 1 - progress * 0.15;

  boxWeb.style.transform = `translate(${dragCurrentX}px, ${dragCurrentY}px) scale(${scale})`;
  boxWeb.style.borderRadius = (progress * 30) + 'px';
  bgOverlay.style.opacity = Math.max(0, 1 - progress * 2);
}, { passive: false });

gestureBar.addEventListener('touchend', () => {
  if (appState !== 'dragging') return;

  if (shouldClose()) {
    closeApp();
  } else {
    appState = 'open';
    boxWeb.style.transition = `all ${SNAP_MS}ms ${EASE_OUT_SMOOTH}`;
    boxWeb.style.transform = 'translate(0, 0) scale(1)';
    boxWeb.style.borderRadius = '0px';
    bgOverlay.style.opacity = '';
    bgOverlay.classList.add('active');
    dockWrap.classList.add('hidden');
    dragCurrentX = 0;
    dragCurrentY = 0;
  }
});

// ─── Gesture Bar: Mouse Events (desktop test) ───
gestureBar.addEventListener('mousedown', (e) => {
  if (appState !== 'open' && appState !== 'opening') return;
  e.preventDefault();
  e.stopPropagation();

  dragStartX = e.clientX;
  dragStartY = e.clientY;
  lastMoveX = dragStartX;
  lastMoveY = dragStartY;
  lastMoveTime = performance.now();
  dragCurrentX = 0;
  dragCurrentY = 0;
  velocityX = 0;
  velocityY = 0;
  appState = 'dragging';

  dockWrap.classList.remove('hidden');
  boxWeb.style.transition = 'none';
});

document.addEventListener('mousemove', (e) => {
  if (appState !== 'dragging') return;

  const now = performance.now();
  const x = e.clientX;
  const y = e.clientY;

  const dt = now - lastMoveTime;
  if (dt > 0) {
    velocityX = (x - lastMoveX) / dt;
    velocityY = (y - lastMoveY) / dt;
  }
  lastMoveX = x;
  lastMoveY = y;
  lastMoveTime = now;

  dragCurrentX = x - dragStartX;
  dragCurrentY = y - dragStartY;

  const dist = Math.sqrt(dragCurrentX * dragCurrentX + dragCurrentY * dragCurrentY);
  const maxDim = Math.max(window.innerWidth, window.innerHeight);
  const progress = Math.min(dist / maxDim, 1);
  const scale = 1 - progress * 0.15;

  boxWeb.style.transform = `translate(${dragCurrentX}px, ${dragCurrentY}px) scale(${scale})`;
  boxWeb.style.borderRadius = (progress * 30) + 'px';
  bgOverlay.style.opacity = Math.max(0, 1 - progress * 2);
});

document.addEventListener('mouseup', () => {
  if (appState !== 'dragging') return;

  if (shouldClose()) {
    closeApp();
  } else {
    appState = 'open';
    boxWeb.style.transition = `all ${SNAP_MS}ms ${EASE_OUT_SMOOTH}`;
    boxWeb.style.transform = 'translate(0, 0) scale(1)';
    boxWeb.style.borderRadius = '0px';
    bgOverlay.style.opacity = '';
    bgOverlay.classList.add('active');
    dockWrap.classList.add('hidden');
    dragCurrentX = 0;
    dragCurrentY = 0;
  }
});

// ─── Icon Click Handlers ───
document.getElementById('btnSettings').addEventListener('click', () => {
  openApp(document.getElementById('btnSettings'), 'settings.html');
});

document.getElementById('btnYouTube').addEventListener('click', () => {
  openApp(document.getElementById('btnYouTube'), 'youtube.html');
});

// ─── Block ───
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());

// ─── Kiosk Mode (Fullscreen + Keyboard Lock + Pointer Lock) ───
let escPressed = false;
let pointerLocked = false;

async function enterKiosk() {
  if (escPressed) return;
  const el = document.documentElement;

  if (!document.fullscreenElement) {
    try { await el.requestFullscreen(); } catch(e) {}
  }

  if (navigator.keyboard && navigator.keyboard.lock) {
    try {
      await navigator.keyboard.lock([
        'Escape','AltLeft','AltRight','Tab','MetaLeft','MetaRight',
        'F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12',
        'ControlLeft','ControlRight','ShiftLeft','ShiftRight'
      ]);
    } catch(e) {}
  }

  try { await el.requestPointerLock(); } catch(e) {}
}

document.addEventListener('click', enterKiosk, { once: true });
document.addEventListener('touchend', enterKiosk, { once: true });

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && !escPressed) setTimeout(enterKiosk, 200);
  if (document.fullscreenElement) escPressed = false;
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = !!document.pointerLockElement;
  if (!document.pointerLockElement && !escPressed && document.fullscreenElement && appState === 'closed') {
    setTimeout(() => {
      document.documentElement.requestPointerLock().catch(() => {});
    }, 200);
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    escPressed = true;
    if (document.pointerLockElement) document.exitPointerLock();
    if (document.fullscreenElement) document.exitFullscreen();
    return;
  }
  e.preventDefault();
});

history.pushState(null,'',location.href);
history.pushState(null,'',location.href);
history.pushState(null,'',location.href);
window.addEventListener('popstate', () => {
  history.pushState(null,'',location.href);
  enterKiosk();
});
</script>
