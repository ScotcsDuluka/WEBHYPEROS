<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
<title>HyperOS Launcher</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden; background: #000;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none; user-select: none;
  overscroll-behavior: none;
  font-family: -apple-system, "SF Pro Display", "Noto Sans SC", system-ui, sans-serif;
}
img.wallpaper {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover; object-position: center;
  user-select: none; -webkit-user-drag: none; pointer-events: none;
  transition: filter 0.6s cubic-bezier(0.32,0.72,0,1), transform 0.6s cubic-bezier(0.32,0.72,0,1);
  will-change: filter, transform;
}
img.wallpaper.blurred {
  filter: brightness(0.75) saturate(1.1);
  transform: scale(1.18);
}
.bg-overlay {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.08); z-index: 15;
  backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
  opacity: 0; pointer-events: none; cursor: pointer;
  transition: opacity 0.6s cubic-bezier(0.32,0.72,0,1), backdrop-filter 0.6s cubic-bezier(0.32,0.72,0,1), -webkit-backdrop-filter 0.6s cubic-bezier(0.32,0.72,0,1);
}
.bg-overlay.active {
  opacity: 1; pointer-events: auto;
  backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
}
.dock-wrap {
  position: fixed; bottom: 68px; left: 50%;
  transform: translateX(-50%); z-index: 10;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.dock-wrap.hidden {
  opacity: 0; transform: translateX(-50%) translateY(30px); pointer-events: none;
}
.dock {
  display: flex; align-items: center; gap: 18px; padding: 13px;
  border-radius: 29px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-top-color: rgba(255,255,255,0.14);
  box-shadow: 0 8px 48px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.1);
  position: relative;
}
.dock::before {
  content: ''; position: absolute;
  top: -1px; left: 15%; right: 15%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
}
.app-icon {
  width: 52px; height: 52px; border-radius: 15px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative; overflow: hidden; flex-shrink: 0;
  transition: transform 0.15s ease;
}
.app-icon img {
  width: 52px; height: 52px; border-radius: 15px;
  display: block; pointer-events: none;
  position: relative; z-index: 1;
}
.app-icon::after {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.03) 100%);
  border-radius: 15px 15px 0 0; pointer-events: none; z-index: 2;
}
.box-anim {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  display: none; transform-origin: 0 0;
  will-change: transform;
  contain: layout paint;
}
.box-anim.passthrough { pointer-events: none; }
.box-anim.z-closing { z-index: 21; }
.box-anim.z-open    { z-index: 22; }
.icon-layer {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 4; pointer-events: none;
  opacity: 0; overflow: hidden;
  will-change: opacity;
  transition: none;
  contain: layout paint style;
  background-repeat: no-repeat;
  background-position: center center;
}
.icon-layer.visible { opacity: 1; }
.icon-layer::after {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.02) 100%);
  pointer-events: none; z-index: 2;
  border-radius: inherit;
}
.box-web {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  background: #fff; overflow: hidden;
  contain: layout paint style;
  z-index: 2;
}
.box-web iframe {
  width: 100%; height: 100%; border: none; display: block;
}
.box-anim.passthrough .box-web,
.box-anim.passthrough iframe { pointer-events: none; }
.box-gesture-pill {
  position: absolute; bottom: 12px; left: 50%;
  transform: translateX(-50%);
  width: 200px; height: 5px; border-radius: 3px;
  background: #fff; mix-blend-mode: difference;
  pointer-events: none; z-index: 5; opacity: 1;
}
.screen-corners {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  border-radius: 44px;
  box-shadow: 0 0 0 100vmax #000;
  pointer-events: none; z-index: 9999;
}
.gesture-bar {
  position: fixed; bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%; height: 60px;
  z-index: 50; touch-action: none; cursor: pointer;
}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════
//  APP URL MAP
// ═══════════════════════════════════════════════════════════
function appPage(title, bg, color) {
  return 'data:text/html;charset=utf-8,' + encodeURIComponent(
    '<html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head>' +
    '<body style="margin:0;padding:0;background:' + bg + ';display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif">' +
    '<p style="color:' + color + ';font-size:28px;font-weight:300">' + title + '</p></body></html>'
  );
}
const APP_URLS = {
  btnSettings: appPage('Settings', '#f5f5f5', 'rgba(0,0,0,0.12)'),
  btnYouTube:  appPage('YouTube',  '#0f0f0f', 'rgba(255,255,255,0.12)'),
  btnCamera:   appPage('Camera',   '#000000', 'rgba(255,255,255,0.08)'),
  btnCalc:     appPage('Calculator','#f0f0f0', 'rgba(0,0,0,0.12)'),
};

// ═══════════════════════════════════════════════════════════
//  BOX POOL
// ═══════════════════════════════════════════════════════════
const boxPool = [
  { idx:0, el:document.getElementById('boxAnim0'), web:document.getElementById('boxWeb0'), frame:document.getElementById('appFrame0'), pill:document.getElementById('boxPill0'), iconLayer:document.getElementById('iconLayer0'), state:'idle', iconId:null, target:null, iconImgSrc:null, extendedIconSrc:null, borderColor:null, rafId:null, openTimer:null, dragCurrentX:0, dragCurrentY:0, dragBaseTx:0, dragBaseTy:0, dragBaseSx:1, dragBaseSy:1 },
  { idx:1, el:document.getElementById('boxAnim1'), web:document.getElementById('boxWeb1'), frame:document.getElementById('appFrame1'), pill:document.getElementById('boxPill1'), iconLayer:document.getElementById('iconLayer1'), state:'idle', iconId:null, target:null, iconImgSrc:null, extendedIconSrc:null, borderColor:null, rafId:null, openTimer:null, dragCurrentX:0, dragCurrentY:0, dragBaseTx:0, dragBaseTy:0, dragBaseSx:1, dragBaseSy:1 }
];

let appState = 'closed';
const gestureBar = document.getElementById('gestureBar');
const dockWrap   = document.getElementById('dockWrap');
const bgOverlay  = document.getElementById('bgOverlay');
const wallpaper  = document.querySelector('img.wallpaper');
let dragStartX=0, dragStartY=0, lastMoveX=0, lastMoveY=0, lastMoveTime=0, velocityX=0, velocityY=0, activeDragBox=null;

const R_ICON=17, R_FULL=46;
const CLOSE_UP_PX = Math.round(window.innerHeight * 0.08);
const OPEN_MS=600, SNAP_MS=600, VELOCITY_CLOSE=0.35, SPEED=4.5, FLING=1.8, DRAG_SHRINK=0.30;

// ═══════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════
function getIconTransform(r) {
  const W=innerWidth, H=innerHeight;
  const sx=r.width/W, sy=r.height/H;
  return { tx: r.left+r.width/2-W*sx/2, ty: r.top+r.height/2-H*sy/2, sx, sy };
}
// ★ คำนวณ border-radius แบบละเอียดทุกมุม — sub-pixel TAA
// p: 0=full-screen (R_FULL), 1=icon (R_ICON)
// sx,sy: current scale
// คืนค่า 8-value border-radius (มุมละค่า X/Y) ทศนิยม 2 ตำแหน่ง
function calcRadiusXY(p,sx,sy) {
  const v=R_FULL*(1-p)+R_ICON*p;
  // ★ sub-pixel: ใช้ toFixed(2) ให้ browser render ละเอียดขึ้น
  const rx=(v/Math.max(.001,sx)).toFixed(2);
  const ry=(v/Math.max(.001,sy)).toFixed(2);
  return rx+'px '+rx+'px '+rx+'px '+rx+'px / '+ry+'px '+ry+'px '+ry+'px '+ry+'px';
}
// ★ คำนวณ visual radius จาก scale ตรง — ไม่ใช้ power function
// minScale: สเกลปัจจุบัน (0.07=icon, 1.0=full)
// iconScale: สเกลของ icon (ตัวหมาย)
// คืนค่า p: 0=full-screen, 1=icon
function radiusFromScale(minScale, iconScale) {
  if (minScale >= 1.0) return 0;
  if (minScale <= iconScale) return 1;
  // ★ quintic smooth step ( smoother than cubic ) — เหมือน TAA
  const t = (1 - minScale) / (1 - iconScale); // 0 at full, 1 at icon
  return t * t * t * (t * (t * 6 - 15) + 10); // quintic smootherstep
}
function calcRadius(p,s) {
  const v=R_FULL*(1-p)+R_ICON*p;
  return (v/Math.max(.01,s))+'px';
}
function shouldClose() {
  if (activeDragBox && activeDragBox.dragCurrentY < -CLOSE_UP_PX) return true;
  if (velocityY < -VELOCITY_CLOSE) return true;
  return false;
}
function applySticky(rawX,rawY) {
  const H=innerHeight, W=innerWidth;
  const FY=H*.4, DY=H*.2; let sy=rawY;
  if(rawY<0){const a=Math.abs(rawY); if(a<=FY)sy=rawY; else{const e=a-FY; sy=-(FY+DY*(1-1/(1+e/DY)));}}
  const FX=W*.1, DX=W*.4; let sx=rawX;
  const ax=Math.abs(rawX);
  if(ax>FX){const e=ax-FX; const c=FX+DX*(1-1/(1+e/DX)); sx=rawX>0?c:-c;}
  // ★ ความหนืด: 0-20% ไม่หนืด, 20-40% → ~60%, 60%+ แรง
  const sDist = Math.sqrt(sx*sx + sy*sy);
  const maxD = Math.max(H, W);
  const rawRatio = Math.min(sDist / maxD, 1);
  let viscous;
  if (rawRatio <= 0.2) {
    viscous = 1; // ไม่หนืด
  } else if (rawRatio <= 0.4) {
    viscous = 1 - (rawRatio - 0.2) / 0.2 * 0.4; // 1→0.6
  } else if (rawRatio <= 0.6) {
    viscous = 0.6 - (rawRatio - 0.4) / 0.2 * 0.3; // 0.6→0.3
  } else {
    viscous = Math.max(0.05, 0.3 - (rawRatio - 0.6) / 0.4 * 0.25); // 0.3→0.05 แรง
  }
  sx *= viscous;
  sy *= viscous;
  return {x:sx, y:sy};
}
// ★ HyperOS animation curves — 100% เลียนแบบ HyperOS จริง
// Open:  damped spring overshoot — เร็ว>เร็ว>เร็ว>เด้งนิด>settle (~350ms)
// Close: smooth ease-out — เร็ว>เร็ว>กลาง>ช้า>ช้านุ่มนวล (~350ms)
class EasingCurve {
  // ═══ 2D cubic-bezier solver (เหมือน CSS cubic-bezier) ═══
  static _b1d(t, p1, p2) {
    const u = 1 - t;
    return 3*u*u*t*p1 + 3*u*t*t*p2 + t*t*t;
  }
  static _sampleX(t, x1, x2) {
    return EasingCurve._b1d(t, x1, x2);
  }
  static _sampleY(t, y1, y2) {
    return EasingCurve._b1d(t, y1, y2);
  }
  static _solveX(x, x1, x2) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let lo = 0, hi = 1;
    for (let i = 0; i < 16; i++) {
      const mid = (lo + hi) / 2;
      if (EasingCurve._sampleX(mid, x1, x2) < x) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }
  // CSS cubic-bezier(x1,y1,x2,y2) → ใส่ time 0→1 ได้ output 0→1
  static cubicBezier(t, x1, y1, x2, y2) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    const param = EasingCurve._solveX(t, x1, x2);
    return EasingCurve._sampleY(param, y1, y2);
  }

  // ★ Open: cubic-bezier(0.32, 0.72, 0, 1)
  // เร็ว>เร็ว>กลาง>ช้า>ช้านุ่มนวล — ไม่มี overshoot (เด้ง)
  static open(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return EasingCurve.cubicBezier(t, 0.32, 0.72, 0.0, 1.0);
  }

  // ★ Close: cubic-bezier(0.32, 0.72, 0, 1)
  // เร็ว>เร็ว>กลาง>ช้า>ช้านุ่มนวล — ไม่มี overshoot
  // แบบเดียวกับ MIUI/HyperOS close animation
  static close(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return EasingCurve.cubicBezier(t, 0.32, 0.72, 0.0, 1.0);
  }
}
function easeOutSmooth(t){
  return EasingCurve.open(t);
}
function findOpenBox(){return boxPool.find(b=>b.state==='open')||null;}
function findActiveBox(){return boxPool.find(b=>b.state==='open'||b.state==='opening'||b.state==='dragging')||null;}
function findIdleBox(){return boxPool.find(b=>b.state==='idle')||null;}

function updateGlobalUI() {
  const hasOpen=boxPool.some(b=>b.state==='open');
  const hasBusy=boxPool.some(b=>b.state==='opening'||b.state==='closing');
  const hideDock=hasOpen||boxPool.some(b=>b.state==='opening');
  dockWrap.classList.toggle('hidden',hideDock);
  if(hideDock){bgOverlay.classList.add('active');bgOverlay.style.opacity='';}
  else{bgOverlay.classList.remove('active');bgOverlay.style.opacity='';}
  wallpaper.classList.toggle('blurred',hasOpen||boxPool.some(b=>b.state==='opening'));
  if(hasOpen)appState='open'; else if(hasBusy)appState='transitioning'; else appState='closed';
}

const ICON_SZ = 52, ICON_EXT = 102, ICON_FULL = ICON_SZ + ICON_EXT * 2; // 256

// ★ ก็อป pixel ขอบแต่ละด้านของไอคอน แล้วยืดในด้านนั้น — สร้างภาพ extended
function createExtendedIcon(imgEl) {
  try {
    // ดึง pixel ไอคอน
    const tmp = document.createElement('canvas');
    tmp.width = ICON_SZ; tmp.height = ICON_SZ;
    const tx = tmp.getContext('2d');
    tx.drawImage(imgEl, 0, 0, ICON_SZ, ICON_SZ);
    const sd = tx.getImageData(0, 0, ICON_SZ, ICON_SZ).data;
    function getP(x,y) { const i=(y*ICON_SZ+x)*4; return [sd[i],sd[i+1],sd[i+2],sd[i+3]]; }

    // สีเฉลี่ยขอบ — สำหรับ background-color fallback
    let ar=0,ag=0,ab=0,cnt=0;
    for(let x=0;x<ICON_SZ;x++) for(let y=0;y<ICON_SZ;y++){
      if(x===0||x===ICON_SZ-1||y===0||y===ICON_SZ-1){
        const i=(y*ICON_SZ+x)*4; ar+=sd[i]; ag+=sd[i+1]; ab+=sd[i+2]; cnt++;
      }
    }
    const avgColor = 'rgb('+Math.round(ar/cnt)+','+Math.round(ag/cnt)+','+Math.round(ab/cnt)+')';

    // สร้าง extended canvas
    const c = document.createElement('canvas');
    c.width = ICON_FULL; c.height = ICON_FULL;
    const cx = c.getContext('2d');
    const dd = cx.createImageData(ICON_FULL, ICON_FULL);
    const dp = dd.data;
    function setP(x,y,r,g,b,a) { const i=(y*ICON_FULL+x)*4; dp[i]=r; dp[i+1]=g; dp[i+2]=b; dp[i+3]=a; }

    // ★ มุม 4 มุม — ก็อป pixel มุม แล้วยึดเต็ม
    const E=ICON_EXT, S=ICON_SZ, F=ICON_FULL;
    const tl=getP(0,0), tr=getP(S-1,0), bl=getP(0,S-1), br=getP(S-1,S-1);
    for(let y=0;y<E;y++) for(let x=0;x<E;x++) setP(x,y,...tl);
    for(let y=0;y<E;y++) for(let x=0;x<E;x++) setP(E+S+x,y,...tr);
    for(let y=0;y<E;y++) for(let x=0;x<E;x++) setP(x,E+S+y,...bl);
    for(let y=0;y<E;y++) for(let x=0;x<E;x++) setP(E+S+x,E+S+y,...br);

    // ★ ขอบบน (แถว y=0) → ยืดขึ้นบน
    for(let x=0;x<S;x++){ const [r,g,b,a]=getP(x,0); for(let y=0;y<E;y++) setP(E+x,y,r,g,b,a); }
    // ★ ขอบล่าง (แถว y=S-1) → ยืดลงล่าง
    for(let x=0;x<S;x++){ const [r,g,b,a]=getP(x,S-1); for(let y=0;y<E;y++) setP(E+x,E+S+y,r,g,b,a); }
    // ★ ขอบซ้าย (คอลัมน์ x=0) → ยืดซ้าย
    for(let y=0;y<S;y++){ const [r,g,b,a]=getP(0,y); for(let x=0;x<E;x++) setP(x,E+y,r,g,b,a); }
    // ★ ขอบขวา (คอลัมน์ x=S-1) → ยืดขวา
    for(let y=0;y<S;y++){ const [r,g,b,a]=getP(S-1,y); for(let x=0;x<E;x++) setP(E+S+x,E+y,r,g,b,a); }

    // ไอคอนตรงกลาง
    for(let y=0;y<S;y++) for(let x=0;x<S;x++){ const [r,g,b,a]=getP(x,y); setP(E+x,E+y,r,g,b,a); }

    cx.putImageData(dd,0,0);
    return { dataURL: c.toDataURL(), avgColor: avgColor };
  } catch(e) { return { dataURL: null, avgColor: 'rgb(80,80,80)' }; }
}

function setupIconLayer(box, iconEl) {
  const layer = box.iconLayer;
  layer.innerHTML = '';
  const imgEl = iconEl.querySelector('img');
  const iconSrc = imgEl.src;
  // ★ ก็อป pixel ขอบแต่ละด้าน → ยืดในด้านนั้น, ไอคอนตรงกลาง
  const { dataURL, avgColor } = createExtendedIcon(imgEl);
  box.iconImgSrc = iconSrc;
  box.extendedIconSrc = dataURL;
  box.borderColor = avgColor;
  layer.style.backgroundColor = avgColor;
  if (dataURL) {
    layer.style.backgroundImage = 'url(' + dataURL + ')';
    layer.style.backgroundSize = ICON_FULL + 'px ' + ICON_FULL + 'px';
  } else {
    layer.style.backgroundImage = 'url(' + iconSrc + ')';
    layer.style.backgroundSize = '52px 52px';
  }
  layer.style.backgroundRepeat = 'no-repeat';
  layer.style.backgroundPosition = 'center center';
  layer.style.transition = 'none';
  void layer.offsetHeight;
  layer.style.transition = '';
}

// ═══════════════════════════════════════════════════════════
//  OPEN APP
// ═══════════════════════════════════════════════════════════
function openApp(iconEl, url) {
  const iconId = iconEl.id;
  const activeBox = findActiveBox();
  if (activeBox && activeBox.iconId === iconId) { closeBox(activeBox); return; }

  // ★ เก็บตำแหน่ง closing box ไว้ก่อน reset — เพื่อต่อ animation
  let resumeFrom = null;

  // ★ สลับแอปแบบ parallel: ปิดเก่าด้วย closeBox, เปิดใหม่ใน box ว่าง
  boxPool.forEach(b => {
    if (b.state === 'idle') return;
    if (b.state === 'opening' || b.state === 'open') { closeBox(b); }
    else if (b.state === 'closing' && b.iconId === iconId) {
      // ★ แอปเดียวกัน → เก็บตำแหน่งก่อน force reset
      if (!resumeFrom) {
        const rect = b.el.getBoundingClientRect();
        resumeFrom = { tx: rect.left, ty: rect.top, sx: rect.width / innerWidth, sy: rect.height / innerHeight };
      }
      forceResetBox(b);
    }
    else if (b.state === 'dragging') { forceResetBox(b); }
    // closing แอปอื่น → ปล่อยทำงานต่อ
  });
  let box = findIdleBox();
  // ★ ถ้าไม่มี idle box ให้ force reset closing box เก่าที่สุด
  if (!box) {
    const closingBoxes = boxPool.filter(b => b.state === 'closing');
    if (closingBoxes.length > 0) {
      const b = closingBoxes[0];
      if (!resumeFrom) {
        const rect = b.el.getBoundingClientRect();
        resumeFrom = { tx: rect.left, ty: rect.top, sx: rect.width / innerWidth, sy: rect.height / innerHeight };
      }
      forceResetBox(b);
    }
    box = findIdleBox();
  }
  if (!box) return;

  void document.body.offsetHeight;
  const iconRect = iconEl.getBoundingClientRect();
  const iconTf = getIconTransform(iconRect);

  box.target = iconTf;
  box.iconId = iconId;
  box.iconImgSrc = iconEl.querySelector('img').src;

  hideDockIcon(iconId);
  setupIconLayer(box, iconEl);

  box.el.style.display = 'block';
  box.el.style.transition = 'none';
  box.web.style.transition = 'none';

  // ★ ถ้ามี resumeFrom → เริ่มจากตำแหน่ง closing box (ต่อเนื่อง)
  // ถ้าไม่มี → เริ่มจาก icon ปกติ
  let fromTx, fromTy, fromSx, fromSy;
  if (resumeFrom) {
    fromTx = resumeFrom.tx;
    fromTy = resumeFrom.ty;
    fromSx = resumeFrom.sx;
    fromSy = resumeFrom.sy;
    box.el.style.transform = 'translate('+fromTx+'px,'+fromTy+'px) scale('+fromSx+','+fromSy+')';
  } else {
    fromTx = iconTf.tx;
    fromTy = iconTf.ty;
    fromSx = iconTf.sx;
    fromSy = iconTf.sy;
    box.el.style.transform = 'translate('+fromTx+'px,'+fromTy+'px) scale('+fromSx+','+fromSy+')';
  }

  box.el.classList.remove('passthrough','z-closing');
  box.el.classList.add('z-open');

  const startR = calcRadiusXY(1, fromSx, fromSy);
  box.iconLayer.style.borderRadius = startR;
  box.web.style.borderRadius = startR;

  // ★ ถ้า resumeFrom → กลับจาก closing, เนื้อหายังอยู่ ไม่ต้องแสดง icon-layer
  if (resumeFrom) {
    box.iconLayer.classList.remove('visible');
    box.web.style.background = '#fff';
    box.web.style.opacity = '1';
    box.pill.style.opacity = '1';
  } else {
    box.iconLayer.classList.add('visible');
    box.web.style.background = 'transparent';
    box.pill.style.opacity = '0';
  }

  box.frame.src = '';
  void box.el.offsetHeight;

  box.state = 'opening';
  let iconHidden = false;
  // ★ ถ้า resumeFrom (กลับจาก closing) → ลดเวลาตามสัดส่วนที่เหลือ
  const fullOpenDuration = 600; // ms
  const minScale = Math.min(fromSx, fromSy);
  const iconMinScale = Math.min(iconTf.sx, iconTf.sy);
  // คำนวณ progress ที่เท่ากับตำแหน่งปัจจุบัน (สัดส่วนจาก icon → fullscreen)
  const resumeProgress = (minScale - iconMinScale) / (1 - iconMinScale);
  const openDuration = resumeFrom
    ? Math.max(150, Math.round(fullOpenDuration * (1 - resumeProgress)))
    : fullOpenDuration;
  let lastOTs=null, openMs=0;
  // ★ control point สำหรับโค้งขึ้นบนเบาๆ
  // bezier ที่ t=0.5 จะเบี่ยงจากเส้นตรง = -0.25*fromTy + 0.5*cpTy
  // ต้องการเบี่ยงขึ้นบนแค่ ~12px → cpTy = 0.5*fromTy - 24
  const openCpTx = (fromTx + 0) / 2;
  const openCpTy = (fromTy + 0) / 2 - 24;

  // ★ cache ค่า border-radius ก่อนหน้า เพื่อไม่เขียน style ถ้าไม่เปลี่ยน
  let prevCssR = '';
  function tickOpen(ts) {
    if (box.state !== 'opening') return;
    if (!lastOTs) lastOTs = ts;
    const frameMs = Math.min(ts-lastOTs, 32);
    lastOTs = ts; openMs += frameMs;
    if (openMs >= openDuration) { finishOpen(); return; }

    const et = EasingCurve.open(openMs / openDuration);

    const curSx = fromSx + (1-fromSx)*et;
    const curSy = fromSy + (1-fromSy)*et;

    // ★ quadratic bezier path: โค้งขึ้นบนเบาๆ
    const u = 1 - et;
    const curTx = u*u*fromTx + 2*u*et*openCpTx + et*et*0;
    const curTy = u*u*fromTy + 2*u*et*openCpTy + et*et*0;

    // ★ batch style writes — เขียน transform ก่อน (composite layer) แล้วค่อย border-radius (paint)
    box.el.style.transform = 'translate('+curTx+'px,'+curTy+'px) scale('+curSx+','+curSy+')';

    // ★ ก็อป pixel ขอบแต่ละด้าน — ปรับ backgroundSize ให้ไอคอนยัง 52px บนจอ
    const bgSz = box.extendedIconSrc ? ICON_FULL : 52;
    box.iconLayer.style.backgroundSize = (bgSz/curSx).toFixed(1)+'px '+(bgSz/curSy).toFixed(1)+'px';

    // ★ radius morphing — เฉพาะเมื่อเปลี่ยนจากค่าก่อน
    const cssR = calcRadiusXY(radiusFromScale(Math.min(curSx, curSy), iconTf.sx), curSx, curSy);
    if (cssR !== prevCssR) {
      prevCssR = cssR;
      box.web.style.borderRadius = cssR;
      box.iconLayer.style.borderRadius = cssR;
    }

    // ★ fade icon-layer ออกเร็วขึ้น — HyperOS จริง icon หายเร็วมาก
    // ถ้า resumeFrom (กลับจาก closing) → icon หายไปแล้ว ไม่ต้องแสดง icon-layer
    if (resumeFrom) {
      if (!iconHidden) {
        iconHidden = true;
        box.iconLayer.classList.remove('visible');
        box.web.style.background = '#fff';
        box.web.style.opacity = '1';
        box.pill.style.opacity = '1';
      }
    } else {
      if (!iconHidden && et > 0.04) {
        iconHidden = true;
        box.iconLayer.classList.remove('visible');
        box.web.style.background = '#fff';
        box.pill.style.opacity = '1';
      }
      // ★ fade web content: ซ่อนตอน icon visible, โชว์เร็วเมื่อ icon หาย
      if (et < 0.04) {
        box.web.style.opacity = '0';
      } else if (et < 0.15) {
        box.web.style.opacity = String((et - 0.04) / 0.11);
      } else {
        box.web.style.opacity = '1';
      }
    }

    box.rafId = requestAnimationFrame(tickOpen);
  }
  function finishOpen() {
    box.el.style.transform = 'none';
    box.web.style.borderRadius = '16px';
    box.web.style.opacity = '1';
    box.iconLayer.classList.remove('visible');
    box.state = 'open';
    box.rafId = null;
    updateGlobalUI();
  }
  box.rafId = requestAnimationFrame(tickOpen);
  if (box.openTimer) clearTimeout(box.openTimer);
  box.openTimer = setTimeout(() => { box.frame.src = url; box.openTimer = null; }, 80);
  box.dragCurrentX = 0; box.dragCurrentY = 0;
  updateGlobalUI();
}

// ═══════════════════════════════════════════════════════════
//  CLOSE BOX
// ═══════════════════════════════════════════════════════════
function closeBox(box) {
  if (box.state !== 'open' && box.state !== 'opening' && box.state !== 'dragging') return;
  box.state = 'closing';
  if (box.openTimer) { clearTimeout(box.openTimer); box.openTimer = null; }
  if (box.rafId) { cancelAnimationFrame(box.rafId); box.rafId = null; }

  // ★ รีเซ็ต web opacity สำหรับกรณีมาจาก opening
  box.web.style.opacity = '1';
  box.web.style.background = '#fff';

  const W=innerWidth, H=innerHeight;
  const rect = box.el.getBoundingClientRect();
  const startTx=rect.left, startTy=rect.top, startSx=rect.width/W, startSy=rect.height/H;

  box.el.style.transition = 'none';
  box.web.style.transition = 'none';
  void box.el.offsetHeight; // ★ force reflow ก่อน set transform ใหม่
  box.el.style.transform = 'translate('+startTx+'px,'+startTy+'px) scale('+startSx+','+startSy+')';

  const target = box.target;
  if (!target) { finishBoxClose(box); return; }
  const tTx=target.tx, tTy=target.ty, tSx=target.sx, tSy=target.sy;

  // ★ Close animation: เส้นโค้งขึ้นข้างบน (มุมมองด้านข้าง)
  // เส้นทางเป็น quadratic bezier: start → ขึ้นบน → icon
  const closeDuration = 550; // ms
  const cpTx = (startTx + tTx) / 2;
  const cpTy = Math.min(startTy, tTy) - H * 0.18 - 4;

  box.el.classList.add('passthrough');
  box.el.classList.remove('z-open');
  box.el.classList.add('z-closing');

  // ★ เตรียม icon-layer (ซ่อนไว้ก่อน) — ก็อป pixel ขอบแต่ละด้าน ยืดในด้านนั้น
  box.iconLayer.innerHTML = '';
  box.iconLayer.style.backgroundColor = box.borderColor || 'rgb(80,80,80)';
  if (box.extendedIconSrc) {
    box.iconLayer.style.backgroundImage = 'url(' + box.extendedIconSrc + ')';
    box.iconLayer.style.backgroundSize = ICON_FULL + 'px ' + ICON_FULL + 'px';
  } else {
    box.iconLayer.style.backgroundImage = 'url(' + box.iconImgSrc + ')';
    box.iconLayer.style.backgroundSize = '52px 52px';
  }
  box.iconLayer.style.backgroundRepeat = 'no-repeat';
  box.iconLayer.style.backgroundPosition = 'center center';
  box.iconLayer.style.transition = 'none';
  void box.iconLayer.offsetHeight;
  box.iconLayer.style.transition = '';
  box.iconLayer.classList.remove('visible');

  // ★ เปิดให้กด dock icon ได้ทันที
  if (box.iconId) enableDockIconClick(box.iconId);

  let totalMs=0, lastTs=null, iconShown=false, prevCloseR='';

  function tick(ts) {
    if (box.state !== 'closing') return;
    if (!lastTs) lastTs = ts;
    const frameMs = Math.min(ts-lastTs, 32);
    lastTs = ts; totalMs += frameMs;
    if (totalMs >= closeDuration) { finishBoxClose(box); return; }

    const p = EasingCurve.close(totalMs / closeDuration); // 0→1 progress

    const curSx = startSx + (tSx-startSx)*p;
    const curSy = startSy + (tSy-startSy)*p;
    const clampSx = Math.max(tSx*.5, Math.min(1.0, curSx));
    const clampSy = Math.max(tSy*.5, Math.min(1.0, curSy));

    // ★ quadratic bezier path: โค้งผ่านตรงกลางจอ
    // B(t) = (1-t)²·P0 + 2(1-t)t·P1 + t²·P2
    const u = 1 - p;
    const curTx = u*u*startTx + 2*u*p*cpTx + p*p*tTx;
    const curTy = u*u*startTy + 2*u*p*cpTy + p*p*tTy;

    const sizeProgress = Math.max(0, Math.min(1, (1-Math.min(clampSx,clampSy))/(1-Math.min(tSx,tSy))));

    // ★ clamp ไม่ให้เกินขอบจอ + เขียน transform ก่อน
    const cBoxW = W * clampSx, cBoxH = H * clampSy;
    const clampTx = Math.max(0, Math.min(curTx, W - cBoxW));
    const clampTy = Math.max(0, Math.min(curTy, H - cBoxH));
    box.el.style.transform = 'translate('+clampTx+'px,'+clampTy+'px) scale('+clampSx+','+clampSy+')';

    // ★ ก็อป pixel ขอบแต่ละด้าน — ปรับ backgroundSize ให้ไอคอนยัง 52px บนจอ
    const bgSzC = box.extendedIconSrc ? ICON_FULL : 52;
    box.iconLayer.style.backgroundSize = (bgSzC/clampSx).toFixed(1)+'px '+(bgSzC/clampSy).toFixed(1)+'px';

    // ★ border-radius — เฉพาะเมื่อเปลี่ยน
    const cssR = calcRadiusXY(radiusFromScale(Math.min(clampSx, clampSy), Math.min(tSx,tSy)), clampSx, clampSy);
    if (cssR !== prevCloseR) {
      prevCloseR = cssR;
      box.web.style.borderRadius = cssR;
      if (iconShown) box.iconLayer.style.borderRadius = cssR;
    }

    // ★ fade web ออก — คงไว้จนถึง 95% แล้วหายเร็ว
    const webOpacity = Math.max(0, 1 - Math.max(0, (sizeProgress - 0.95) / 0.05));
    box.web.style.opacity = String(webOpacity);

    // ★ fade in icon-layer — icon โผล่ตอน size ใกล้เป้า (~85%)
    if (!iconShown && sizeProgress > 0.85) {
      iconShown = true;
      box.iconLayer.classList.add('visible');
      box.web.style.background = 'transparent';
    }

    if (box.pill) box.pill.style.opacity = Math.max(0, 1-sizeProgress*2.5);

    box.rafId = requestAnimationFrame(tick);
  }
  box.rafId = requestAnimationFrame(tick);
  updateGlobalUI();
}

function finishBoxClose(box) {
  if (box.rafId) { cancelAnimationFrame(box.rafId); box.rafId = null; }
  box.el.style.display = 'none';
  box.el.style.transform = 'none';
  box.el.style.transition = 'none';
  box.el.classList.remove('passthrough','z-closing');
  box.el.classList.add('z-open');
  box.web.style.opacity = '1';
  box.web.style.borderRadius = '16px';
  box.web.style.background = '#fff';
  box.web.style.transition = 'none';
  box.iconLayer.style.transition = 'none';
  box.iconLayer.classList.remove('visible');
  box.iconLayer.innerHTML = '';
  box.iconLayer.style.borderRadius = '';
  box.iconLayer.style.backgroundImage = '';
  box.iconLayer.style.backgroundSize = '';
  box.iconLayer.style.backgroundRepeat = '';
  box.iconLayer.style.backgroundPosition = '';
  box.iconLayer.style.backgroundColor = '';
  void box.iconLayer.offsetHeight;
  box.iconLayer.style.transition = '';
  box.pill.style.opacity = '1';
  if (box.iconId) showDockIcon(box.iconId);
  box.frame.src = '';
  box.state = 'idle';
  box.iconId = null; box.target = null; box.iconImgSrc = null; box.extendedIconSrc = null; box.borderColor = null;
  box.dragCurrentX = 0; box.dragCurrentY = 0;
  updateGlobalUI();
}

function forceResetBox(box) {
  if (box.rafId) { cancelAnimationFrame(box.rafId); box.rafId = null; }
  if (box.openTimer) { clearTimeout(box.openTimer); box.openTimer = null; }
  box.el.style.display = 'none';
  box.el.style.transform = 'none';
  box.el.style.transition = 'none';
  box.el.classList.remove('passthrough','z-closing');
  box.el.classList.add('z-open');
  box.web.style.opacity = '1';
  box.web.style.borderRadius = '16px';

  box.iconLayer.style.transition = 'none';
  box.iconLayer.classList.remove('visible');

  box.iconLayer.style.borderRadius = '';
  box.iconLayer.style.backgroundImage = '';
  box.iconLayer.style.backgroundSize = '';

  box.iconLayer.style.backgroundPosition = '';
  box.iconLayer.style.backgroundColor = '';
  void box.iconLayer.offsetHeight;

  box.pill.style.opacity = '1';

  box.frame.src = '';
  box.state = 'idle';
  box.iconId = null; box.target = null; box.iconImgSrc = null; box.extendedIconSrc = null; box.borderColor = null;
  box.dragCurrentX = 0; box.dragCurrentY = 0;
  box.rafId = null; box.openTimer = null;
  updateGlobalUI();
}

// ═══════════════════════════════════════════════════════════
//  GESTURE
// ═══════════════════════════════════════════════════════════
function startDrag(ob, sx, sy) {
  activeDragBox = ob;
  dragStartX=sx; dragStartY=sy; lastMoveX=sx; lastMoveY=sy;
  lastMoveTime = performance.now(); velocityX=0; velocityY=0;

  // ★ ถ้ากำลัง opening ให้จับตำแหน่งปัจจุบันเป็นฐาน
  if (ob.state === 'opening') {
    if (ob.rafId) { cancelAnimationFrame(ob.rafId); ob.rafId = null; }
    const rect = ob.el.getBoundingClientRect();
    ob.dragBaseTx = rect.left;
    ob.dragBaseTy = rect.top;
    ob.dragBaseSx = rect.width / innerWidth;
    ob.dragBaseSy = rect.height / innerHeight;
    // ★ รีเซ็ต visual state ทั้งหมดที่อาจค้างอยู่จาก opening animation
    ob.web.style.opacity = '1';
    ob.web.style.background = '#fff';
    ob.web.style.borderRadius = '16px';
    ob.iconLayer.classList.remove('visible');
    ob.iconLayer.style.borderRadius = '';
    ob.pill.style.opacity = '1';
    ob.wasOpening = true;
    // ★ ขยาย dragBaseSx/Sy ไป 1.0 ระหว่าง drag — box ขยายต่อไปพร้อมตามมือ
    ob._expandRaf = null;
    ob._expandStart = performance.now();
    ob._expandFromSx = ob.dragBaseSx;
    ob._expandFromSy = ob.dragBaseSy;
    ob._expandFromTx = ob.dragBaseTx;
    ob._expandFromTy = ob.dragBaseTy;
    const expandDur = 400; // ms ให้ขยายจนเต็ม
    function tickExpand() {
      if (ob.state !== 'dragging') { ob._expandRaf = null; return; }
      const elapsed = performance.now() - ob._expandStart;
      const t = Math.min(1, elapsed / expandDur);
      const et = EasingCurve.open(t);
      ob.dragBaseSx = ob._expandFromSx + (1 - ob._expandFromSx) * et;
      ob.dragBaseSy = ob._expandFromSy + (1 - ob._expandFromSy) * et;
      ob.dragBaseTx = ob._expandFromTx + (0 - ob._expandFromTx) * et;
      ob.dragBaseTy = ob._expandFromTy + (0 - ob._expandFromTy) * et;
      // ★ render ทันที — ใช้ dragCurrentX/Y ปัจจุบัน
      const dx = ob.dragCurrentX, dy = ob.dragCurrentY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const maxD = Math.max(innerWidth, innerHeight);
      const progress = Math.min(dist/maxD, 1);
      let dragScale;
      if (progress <= 0.4) { dragScale = 1 - progress * 1.5; }
      else { dragScale = Math.max(0.08, 0.4 - (progress - 0.4) / 0.3 * 0.2); }
      const curSx = ob.dragBaseSx * dragScale;
      const curSy = ob.dragBaseSy * dragScale;
      const curTx = ob.dragBaseTx + dx;
      const curTy = ob.dragBaseTy + dy;
      const halfW = innerWidth / 2 * (1 - dragScale);
      const halfH = innerHeight / 2 * (1 - dragScale);
      const boxW = innerWidth * curSx, boxH = innerHeight * curSy;
      let finalX = Math.max(0, Math.min(curTx + halfW, innerWidth - boxW));
      let finalY = Math.max(0, Math.min(curTy + halfH, innerHeight - boxH));
      ob.el.style.transform = 'translate('+finalX+'px,'+finalY+'px) scale('+curSx+','+curSy+')';
      ob.web.style.borderRadius = calcRadiusXY(radiusFromScale(Math.min(curSx, curSy), 0.07), curSx, curSy);
      if (t < 1) ob._expandRaf = requestAnimationFrame(tickExpand);
      else ob._expandRaf = null;
    }
    ob._expandRaf = requestAnimationFrame(tickExpand);
  } else {
    ob.dragBaseTx = 0;
    ob.dragBaseTy = 0;
    ob.dragBaseSx = 1;
    ob.dragBaseSy = 1;
    ob.wasOpening = false;
  }

  ob.state = 'dragging'; ob.dragCurrentX=0; ob.dragCurrentY=0;
  appState = 'dragging';
  dockWrap.classList.remove('hidden');
  ob.el.style.transition = 'none';
  ob.web.style.transition = 'none';
}
function moveDrag(x, y) {
  if (!activeDragBox || activeDragBox.state !== 'dragging') return;
  const now = performance.now();
  const dt = now - lastMoveTime;
  if (dt > 0) { velocityX=(x-lastMoveX)/dt; velocityY=(y-lastMoveY)/dt; }
  lastMoveX=x; lastMoveY=y; lastMoveTime=now;
  const rawX=x-dragStartX, rawY=y-dragStartY;
  const s = applySticky(rawX, rawY);
  activeDragBox.dragCurrentX=s.x; activeDragBox.dragCurrentY=s.y;
  const dist=Math.sqrt(s.x*s.x+s.y*s.y);
  const maxD=Math.max(innerWidth,innerHeight);
  const progress=Math.min(dist/maxD,1);
  // ★ ขนาด: 0-40% → ~40%, 40-70% → ~20%
  let dragScale;
  if (progress <= 0.4) {
    dragScale = 1 - progress * 1.5; // 100%→40%
  } else {
    dragScale = Math.max(0.08, 0.4 - (progress - 0.4) / 0.3 * 0.2); // 40%→20%
  }
  // ★ BOX ตามมือ + หดเข้าตรงกลางเฟรม (ชดเชย scale origin 0,0)
  const curTx = activeDragBox.dragBaseTx + s.x;
  const curTy = activeDragBox.dragBaseTy + s.y;
  const curSx = activeDragBox.dragBaseSx * dragScale;
  const curSy = activeDragBox.dragBaseSy * dragScale;
  // ชดเชย: เมื่อ scale ลด ขอบล่าง/ขวาจะหดเข้า → ดึงกลับให้กลางเฟรม
  const halfW = innerWidth / 2 * (1 - dragScale);
  const halfH = innerHeight / 2 * (1 - dragScale);
  // ★ clamp ไม่ให้เกินขอบจอ
  const boxW = innerWidth * curSx, boxH = innerHeight * curSy;
  let finalX = Math.max(0, Math.min(curTx + halfW, innerWidth - boxW));
  let finalY = Math.max(0, Math.min(curTy + halfH, innerHeight - boxH));
  activeDragBox.el.style.transform='translate('+finalX+'px,'+finalY+'px) scale('+curSx+','+curSy+')';
  const dragRadiusP = radiusFromScale(Math.min(curSx, curSy), 0.07);
  activeDragBox.web.style.borderRadius=calcRadiusXY(dragRadiusP,curSx,curSy);
  bgOverlay.style.opacity=Math.max(0,1-progress*2);
  if(activeDragBox.pill) activeDragBox.pill.style.opacity=Math.max(0,1-progress*3);
}
function endDrag() {
  if (!activeDragBox || activeDragBox.state !== 'dragging') return;
  // ★ หยุด expand animation ถ้ามี
  if (activeDragBox._expandRaf) { cancelAnimationFrame(activeDragBox._expandRaf); activeDragBox._expandRaf = null; }
  if (shouldClose()) { closeBox(activeDragBox); }
  else {
    activeDragBox.state = 'open';
    // ★ บังคับ browser เห็นตำแหน่งปัจจุบันก่อน แล้วค่อย transition
    void activeDragBox.el.offsetHeight; // force reflow
    activeDragBox.el.style.transition='transform '+SNAP_MS+'ms cubic-bezier(0.32,0.72,0,1)';
    activeDragBox.el.style.transform='translate(0px,0px) scale(1,1)';
    activeDragBox.web.style.transition='border-radius '+SNAP_MS+'ms cubic-bezier(0.32,0.72,0,1)';
    activeDragBox.web.style.borderRadius='16px';
    activeDragBox.web.style.background='#fff';
    activeDragBox.web.style.opacity='1';
    activeDragBox.iconLayer.classList.remove('visible');
    activeDragBox.iconLayer.style.borderRadius='';
    bgOverlay.style.opacity=''; bgOverlay.classList.add('active');
    dockWrap.classList.add('hidden');
    activeDragBox.dragCurrentX=0; activeDragBox.dragCurrentY=0;
    if(activeDragBox.pill) activeDragBox.pill.style.opacity='1';
    updateGlobalUI();
  }
  activeDragBox = null;
}

gestureBar.addEventListener('touchstart', e => {
  const ab=findActiveBox(); if(!ab) return;
  e.preventDefault(); e.stopPropagation();
  startDrag(ab, e.touches[0].clientX, e.touches[0].clientY);
}, {passive:false});
gestureBar.addEventListener('touchmove', e => {
  if(!activeDragBox||activeDragBox.state!=='dragging') return;
  e.preventDefault(); e.stopPropagation();
  moveDrag(e.touches[0].clientX, e.touches[0].clientY);
}, {passive:false});
gestureBar.addEventListener('touchend', endDrag);

let mouseDownPos=null;
gestureBar.addEventListener('mousedown', e => {
  const ab=findActiveBox(); if(!ab) return;
  e.preventDefault(); e.stopPropagation();
  mouseDownPos={x:e.clientX,y:e.clientY};
  startDrag(ab, e.clientX, e.clientY);
});
document.addEventListener('mousemove', e => { moveDrag(e.clientX, e.clientY); });
document.addEventListener('mouseup', e => {
  if(!activeDragBox){mouseDownPos=null;return;}
  if(mouseDownPos){const dx=e.clientX-mouseDownPos.x,dy=e.clientY-mouseDownPos.y;if(Math.sqrt(dx*dx+dy*dy)<10)velocityY=-1;}
  mouseDownPos=null; endDrag();
});
bgOverlay.addEventListener('click', () => { const ab=findActiveBox(); if(ab) closeBox(ab); });

document.querySelectorAll('.app-icon').forEach(icon => {
  icon.addEventListener('click', () => { openApp(icon, APP_URLS[icon.id]||icon.dataset.url); });
});

document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('dblclick', e=>e.preventDefault());
document.addEventListener('dragstart', e=>e.preventDefault());
document.addEventListener('selectstart', e=>e.preventDefault());

let escPressed=false;
async function enterKiosk(){
  if(escPressed)return;
  if(!document.fullscreenElement){try{await document.documentElement.requestFullscreen();}catch(e){}}
}
document.addEventListener('click',enterKiosk,{once:true});
document.addEventListener('touchend',enterKiosk,{once:true});
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&!escPressed)setTimeout(enterKiosk,200);
  if(document.fullscreenElement)escPressed=false;
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){escPressed=true;if(document.fullscreenElement)document.exitFullscreen();return;}
  e.preventDefault();
});
history.pushState(null,'',location.href);
history.pushState(null,'',location.href);
history.pushState(null,'',location.href);
window.addEventListener('popstate',()=>{history.pushState(null,'',location.href);enterKiosk();});
</script>
