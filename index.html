<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
<title>HyperOS Launcher</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
  font-family: -apple-system, "SF Pro Display", "Noto Sans SC", system-ui, sans-serif;
}

/* ─── Wallpaper ─── */
img.wallpaper {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* ─── Background Overlay ─── */
.bg-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.35);
  z-index: 15;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}
.bg-overlay.active { opacity: 1; }

/* ─── Dock ─── */
.dock-wrap {
  position: fixed;
  bottom: 58px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  transition: opacity 0.45s ease, transform 0.45s ease;
}
.dock-wrap.hidden {
  opacity: 0;
  transform: translateX(-50%) translateY(30px);
  pointer-events: none;
}
.dock {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 13px 13px;
  border-radius: 29px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-top-color: rgba(255,255,255,0.14);
  box-shadow: 0 8px 48px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.1);
  position: relative;
}
.dock::before {
  content: '';
  position: absolute;
  top: -1px; left: 15%; right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
}

/* ─── App Icon ─── */
.app-icon {
  width: 52px; height: 52px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s ease;
  position: relative;
  overflow: hidden;
}
.app-icon:active { transform: scale(0.88); }
.app-icon::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.04) 100%);
  border-radius: 13px 13px 0 0;
  pointer-events: none;
}
.app-icon svg { position: relative; z-index: 1; }

/* ─── BOX_anim — ICON + BOX ในกล่องเดียวกัน ─── */
.box-anim {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 20;
  display: none;
  transform-origin: 0 0;
  will-change: transform;
}
.box-anim.passthrough {
  pointer-events: none;
}

/* Icon overlay — แสดงเมื่อ BOX_anim เล็ก = ดูเหมือนไอคอน */
.anim-icon {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 15px;
  z-index: 2;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.anim-icon.visible { opacity: 1; }
.anim-icon svg {
  width: 52%; height: 52%;
  position: relative;
  z-index: 1;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
}
.anim-icon::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.04) 100%);
  border-radius: 15px 15px 0 0;
  pointer-events: none;
}

/* Box WEB — iframe content */
.box-web {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #fff;
  overflow: hidden;
  will-change: border-radius;
}
.box-web iframe {
  width: 100%; height: 100%;
  border: none; display: block;
}
.box-anim.passthrough .box-web,
.box-anim.passthrough iframe {
  pointer-events: none;
}

/* ─── Gesture Bar ─── */
.gesture-bar {
  position: fixed;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 160px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  touch-action: none;
  cursor: grab;
}
.gesture-bar:active { cursor: grabbing; }
.gesture-pill {
  width: 134px;
  height: 5px;
  border-radius: 3px;
  background: rgba(255,255,255,0.35);
  transition: background 0.4s ease, width 0.15s ease;
  pointer-events: none;
}
.gesture-bar:active .gesture-pill { width: 110px; }
.gesture-bar.on-app .gesture-pill { background: rgba(0,0,0,0.18); }
.gesture-bar.on-app:active .gesture-pill { background: rgba(0,0,0,0.35); }
</style>
</head>
<body>

<img class="wallpaper" src="https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/4b5d40216256937.67b492e0e7551.jpg" alt="">

<!-- Background Overlay -->
<div class="bg-overlay" id="bgOverlay"></div>

<!-- BOX_anim — ICON + BOX อยู่ด้วยกัน -->
<div class="box-anim" id="boxAnim">
  <div class="box-web" id="boxWeb">
    <iframe id="appFrame" src="" allow="autoplay; fullscreen"></iframe>
  </div>
  <div class="anim-icon" id="animIcon"></div>
</div>

<!-- Gesture Bar -->
<div class="gesture-bar" id="gestureBar">
  <div class="gesture-pill"></div>
</div>

<!-- Dock -->
<div class="dock-wrap" id="dockWrap">
  <div class="dock">
    <div class="app-icon" style="background: linear-gradient(145deg, #CFD8DC, #546E7A);" id="btnSettings">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="white" fill-opacity=".88">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/>
      </svg>
    </div>
    <div class="app-icon" style="background: linear-gradient(145deg, #EF9A9A, #C62828);" id="btnYouTube">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="white" fill-opacity=".9">
        <path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/>
      </svg>
    </div>
  </div>
</div>

<script>
// ─── State ───
let appState = 'closed'; // closed | open | dragging | closing
let lastIconEl = null;
let pendingUrl = '';
let dragStartX = 0, dragStartY = 0;
let dragCurrentX = 0, dragCurrentY = 0;
let openTimer = null;
let closeRafId = null;

// Velocity
let lastMoveX = 0, lastMoveY = 0, lastMoveTime = 0;
let velocityX = 0, velocityY = 0;

const boxAnim  = document.getElementById('boxAnim');
const boxWeb   = document.getElementById('boxWeb');
const animIcon = document.getElementById('animIcon');
const appFrame = document.getElementById('appFrame');
const gestureBar = document.getElementById('gestureBar');
const dockWrap = document.getElementById('dockWrap');
const bgOverlay = document.getElementById('bgOverlay');

// ─── Tuning ───
const CLOSE_UP_PX = 50;
const OPEN_MS = 550;
const SNAP_MS = 550;
const VELOCITY_CLOSE = 0.35;
const EASE_OUT_SMOOTH = 'cubic-bezier(0.16, 1, 0.3, 1)';

// ─── Helper: ICON → transform ที่จะวาง BOX_anim ที่ไอคอน ───
function getIconTransform(iconRect) {
  const W = window.innerWidth;
  const H = window.innerHeight;
  const s = iconRect.width / W;
  const tx = iconRect.left + iconRect.width / 2 - W * s / 2;
  const ty = iconRect.top + iconRect.height / 2 - H * s / 2;
  return { tx, ty, s };
}

// ─── Helper: border-radius ที่ถูกต้อง (ชดเชย scale) ───
function calcRadius(progress, scale) {
  // progress: 0=fullscreen(squared), 1=icon(rounded)
  const visualR = progress * 15;
  return visualR / Math.max(0.01, scale);
}

// ─── Helper: Should close? ───
function shouldClose() {
  if (dragCurrentY < -CLOSE_UP_PX) return true;
  if (velocityY < -VELOCITY_CLOSE) return true;
  return false;
}

// ─── Helper: Update gesture bar ───
function updateGestureStyle() {
  gestureBar.classList.toggle('on-app', appState !== 'closed');
}

// ─── Helper: Set anim-icon content from dock icon ───
function setAnimIconContent(iconEl) {
  animIcon.style.background = iconEl.style.background;
  const svg = iconEl.querySelector('svg');
  animIcon.innerHTML = svg ? svg.outerHTML : '';
}

// ─── Open App ───
function openApp(iconEl, url) {
  if (appState === 'open' && lastIconEl === iconEl) return;

  if (closeRafId) { cancelAnimationFrame(closeRafId); closeRafId = null; }

  const W = window.innerWidth;
  const H = window.innerHeight;
  const iconRect = iconEl.getBoundingClientRect();
  const iconTf = getIconTransform(iconRect);

  lastIconEl = iconEl;
  pendingUrl = url;
  setAnimIconContent(iconEl);

  // ── Interrupt closing/dragging ──
  if (appState === 'closing' || appState === 'dragging') {
    boxAnim.classList.remove('passthrough');
    animIcon.classList.remove('visible');
    boxWeb.style.background = '#fff';
    boxWeb.style.opacity = '1';

    boxAnim.style.transition = `transform ${OPEN_MS}ms ${EASE_OUT_SMOOTH}`;
    boxAnim.style.transform = 'none';
    boxWeb.style.transition = `border-radius ${OPEN_MS}ms ${EASE_OUT_SMOOTH}`;
    boxWeb.style.borderRadius = '0px';

    dockWrap.classList.add('hidden');
    bgOverlay.classList.add('active');
    bgOverlay.style.opacity = '';

    appState = 'open';
    dragCurrentX = 0;
    dragCurrentY = 0;
    updateGestureStyle();

    if (openTimer) clearTimeout(openTimer);
    openTimer = setTimeout(() => { appFrame.src = url; openTimer = null; }, 100);
    if (document.pointerLockElement) document.exitPointerLock();
    return;
  }

  // ── Normal open from closed ──
  // Start at icon: show icon overlay
  boxAnim.style.display = 'block';
  boxAnim.style.transition = 'none';
  boxAnim.style.transform = `translate(${iconTf.tx}px, ${iconTf.ty}px) scale(${iconTf.s})`;
  boxAnim.classList.remove('passthrough');

  animIcon.classList.add('visible');
  boxWeb.style.borderRadius = calcRadius(1, iconTf.s) + 'px';
  boxWeb.style.background = 'transparent';
  boxWeb.style.opacity = '1';

  appFrame.src = '';
  void boxAnim.offsetHeight;

  dockWrap.classList.add('hidden');
  bgOverlay.classList.add('active');

  // Animate to fullscreen
  boxAnim.style.transition = `transform ${OPEN_MS}ms ${EASE_OUT_SMOOTH}`;
  boxAnim.style.transform = 'none';
  boxWeb.style.transition = `border-radius ${OPEN_MS}ms ${EASE_OUT_SMOOTH}`;
  boxWeb.style.borderRadius = '0px';

  // Fade out icon overlay early
  setTimeout(() => {
    animIcon.classList.remove('visible');
    boxWeb.style.background = '#fff';
  }, OPEN_MS * 0.25);

  appState = 'open';
  dragCurrentX = 0;
  dragCurrentY = 0;
  updateGestureStyle();

  if (openTimer) clearTimeout(openTimer);
  openTimer = setTimeout(() => { appFrame.src = url; openTimer = null; }, 100);
  if (document.pointerLockElement) document.exitPointerLock();
}

// ─── Close App (Spring Physics — เวี่ยงบน + เด้งสลับ) ───
function closeApp() {
  if (appState !== 'dragging' && appState !== 'open') return;
  appState = 'closing';

  if (openTimer)  { clearTimeout(openTimer); openTimer = null; }
  if (closeRafId) { cancelAnimationFrame(closeRafId); closeRafId = null; }

  const W = window.innerWidth;
  const H = window.innerHeight;
  const iconRect = lastIconEl.getBoundingClientRect();
  const target = getIconTransform(iconRect);

  // Current state from drag
  const dragDist = Math.sqrt(dragCurrentX * dragCurrentX + dragCurrentY * dragCurrentY);
  const maxDim = Math.max(W, H);
  const dragProgress = Math.min(dragDist / maxDim, 1);
  const dragScale = 1 - dragProgress * 0.15;

  // Spring state: tx, ty, s
  let curTx = dragCurrentX;
  let curTy = dragCurrentY;
  let curS  = dragScale;

  // Target
  const tTx = target.tx;
  const tTy = target.ty;
  const tS  = target.s;

  // Velocity: continue drag momentum + เวี่ยงบน
  let velTx = 0;
  let velTy = 0;
  let velS  = 0;

  const swipeSpeed = Math.sqrt(velocityX * velocityX + velocityY * velocityY);
  if (swipeSpeed > 0.15) {
    const momentum = swipeSpeed * 2800;
    velTy = -Math.abs(momentum); // ขึ้นบนเท่านั้น
  }

  // Spring: position underdamped (เด้งสลับ), scale overdamped (ลื่น)
  const posStiff = 200;
  const posDamp  = 7;
  const sStiff   = 350;
  const sDamp    = 22;

  // UI
  boxAnim.classList.add('passthrough');
  boxAnim.style.transition = 'none';
  boxWeb.style.transition = 'none';
  dockWrap.classList.remove('hidden');
  bgOverlay.classList.remove('active');
  bgOverlay.style.opacity = '';

  let totalMs = 0;
  const maxMs = 1200;
  let lastTs = null;
  let settled = false;
  let iconShown = false;

  function tick(ts) {
    if (!lastTs) lastTs = ts;
    const frameMs = Math.min(ts - lastTs, 32);
    lastTs = ts;
    totalMs += frameMs;

    if (totalMs > maxMs) { finishClose(); return; }

    // Spring sub-steps
    const steps = Math.max(1, Math.round(frameMs / 4));
    const dt = (frameMs / 1000) / steps;
    for (let i = 0; i < steps; i++) {
      // Position spring (underdamped = เด้งสลับ)
      const fx = -posStiff * (curTx - tTx) - posDamp * velTx;
      const fy = -posStiff * (curTy - tTy) - posDamp * velTy;
      velTx += fx * dt;
      velTy += fy * dt;
      curTx += velTx * dt;
      curTy += velTy * dt;

      // Scale spring (overdamped = ลื่น ไม่เด้ง)
      const fs = -sStiff * (curS - tS) - sDamp * velS;
      velS += fs * dt;
      curS += velS * dt;
    }

    // Clamp scale
    curS = Math.max(tS * 0.5, Math.min(1.1, curS));

    // Border-radius (compensate for scale)
    const sizeProgress = Math.max(0, Math.min(1, (1 - curS) / (1 - tS)));
    const cssR = calcRadius(sizeProgress, curS);

    // Show icon overlay when box is small
    if (!iconShown && curS < 0.25) {
      iconShown = true;
      animIcon.classList.add('visible');
      boxWeb.style.background = 'transparent';
    }

    // Apply
    boxAnim.style.transform = `translate(${curTx}px, ${curTy}px) scale(${curS})`;
    boxWeb.style.borderRadius = cssR + 'px';

    // Settled?
    const txD = Math.abs(curTx - tTx);
    const tyD = Math.abs(curTy - tTy);
    const sD  = Math.abs(curS - tS);
    const vel = Math.sqrt(velTx * velTx + velTy * velTy);

    if (!settled && txD < 1 && tyD < 1 && sD < 0.003 && vel < 5) {
      settled = true;
      // Gentle finish: smooth snap + fade
      boxAnim.style.transition = `transform 300ms cubic-bezier(0.25, 0, 0.15, 1)`;
      boxAnim.style.transform = `translate(${tTx}px, ${tTy}px) scale(${tS})`;
      boxWeb.style.transition = `border-radius 300ms cubic-bezier(0.25, 0, 0.15, 1), opacity 300ms ease`;
      boxWeb.style.borderRadius = calcRadius(1, tS) + 'px';
      boxWeb.style.opacity = '0';
      setTimeout(finishClose, 310);
      return;
    }

    closeRafId = requestAnimationFrame(tick);
  }

  function finishClose() {
    if (closeRafId) { cancelAnimationFrame(closeRafId); closeRafId = null; }
    boxAnim.style.display = 'none';
    boxAnim.style.transform = 'none';
    boxAnim.style.transition = 'none';
    boxAnim.classList.remove('passthrough');
    boxWeb.style.opacity = '1';
    boxWeb.style.borderRadius = '0px';
    boxWeb.style.background = '#fff';
    boxWeb.style.transition = 'none';
    animIcon.classList.remove('visible');
    appFrame.src = '';
    dragCurrentX = 0;
    dragCurrentY = 0;
    velocityX = 0;
    velocityY = 0;
    appState = 'closed';
    updateGestureStyle();
    enterKiosk();
  }

  closeRafId = requestAnimationFrame(tick);
}

// ─── Gesture Bar: Touch ───
gestureBar.addEventListener('touchstart', (e) => {
  if (appState !== 'open') return;
  e.preventDefault();
  e.stopPropagation();

  dragStartX = e.touches[0].clientX;
  dragStartY = e.touches[0].clientY;
  lastMoveX = dragStartX;
  lastMoveY = dragStartY;
  lastMoveTime = performance.now();
  dragCurrentX = 0;
  dragCurrentY = 0;
  velocityX = 0;
  velocityY = 0;
  appState = 'dragging';

  dockWrap.classList.remove('hidden');
  boxAnim.style.transition = 'none';
  boxWeb.style.transition = 'none';
}, { passive: false });

gestureBar.addEventListener('touchmove', (e) => {
  if (appState !== 'dragging') return;
  e.preventDefault();
  e.stopPropagation();

  const now = performance.now();
  const x = e.touches[0].clientX;
  const y = e.touches[0].clientY;

  const dt = now - lastMoveTime;
  if (dt > 0) {
    velocityX = (x - lastMoveX) / dt;
    velocityY = (y - lastMoveY) / dt;
  }
  lastMoveX = x;
  lastMoveY = y;
  lastMoveTime = now;

  dragCurrentX = x - dragStartX;
  dragCurrentY = y - dragStartY;

  const dist = Math.sqrt(dragCurrentX * dragCurrentX + dragCurrentY * dragCurrentY);
  const maxDim = Math.max(window.innerWidth, window.innerHeight);
  const progress = Math.min(dist / maxDim, 1);
  const scale = 1 - progress * 0.15;

  boxAnim.style.transform = `translate(${dragCurrentX}px, ${dragCurrentY}px) scale(${scale})`;
  boxWeb.style.borderRadius = calcRadius(progress, scale) + 'px';
  bgOverlay.style.opacity = Math.max(0, 1 - progress * 2);
}, { passive: false });

gestureBar.addEventListener('touchend', () => {
  if (appState !== 'dragging') return;
  if (shouldClose()) {
    closeApp();
  } else {
    appState = 'open';
    boxAnim.style.transition = `transform ${SNAP_MS}ms ${EASE_OUT_SMOOTH}`;
    boxAnim.style.transform = 'none';
    boxWeb.style.transition = `border-radius ${SNAP_MS}ms ${EASE_OUT_SMOOTH}`;
    boxWeb.style.borderRadius = '0px';
    bgOverlay.style.opacity = '';
    bgOverlay.classList.add('active');
    dockWrap.classList.add('hidden');
    dragCurrentX = 0;
    dragCurrentY = 0;
  }
});

// ─── Gesture Bar: Mouse ───
gestureBar.addEventListener('mousedown', (e) => {
  if (appState !== 'open') return;
  e.preventDefault();
  e.stopPropagation();

  dragStartX = e.clientX;
  dragStartY = e.clientY;
  lastMoveX = dragStartX;
  lastMoveY = dragStartY;
  lastMoveTime = performance.now();
  dragCurrentX = 0;
  dragCurrentY = 0;
  velocityX = 0;
  velocityY = 0;
  appState = 'dragging';

  dockWrap.classList.remove('hidden');
  boxAnim.style.transition = 'none';
  boxWeb.style.transition = 'none';
});

document.addEventListener('mousemove', (e) => {
  if (appState !== 'dragging') return;

  const now = performance.now();
  const x = e.clientX;
  const y = e.clientY;

  const dt = now - lastMoveTime;
  if (dt > 0) {
    velocityX = (x - lastMoveX) / dt;
    velocityY = (y - lastMoveY) / dt;
  }
  lastMoveX = x;
  lastMoveY = y;
  lastMoveTime = now;

  dragCurrentX = x - dragStartX;
  dragCurrentY = y - dragStartY;

  const dist = Math.sqrt(dragCurrentX * dragCurrentX + dragCurrentY * dragCurrentY);
  const maxDim = Math.max(window.innerWidth, window.innerHeight);
  const progress = Math.min(dist / maxDim, 1);
  const scale = 1 - progress * 0.15;

  boxAnim.style.transform = `translate(${dragCurrentX}px, ${dragCurrentY}px) scale(${scale})`;
  boxWeb.style.borderRadius = calcRadius(progress, scale) + 'px';
  bgOverlay.style.opacity = Math.max(0, 1 - progress * 2);
});

document.addEventListener('mouseup', () => {
  if (appState !== 'dragging') return;
  if (shouldClose()) {
    closeApp();
  } else {
    appState = 'open';
    boxAnim.style.transition = `transform ${SNAP_MS}ms ${EASE_OUT_SMOOTH}`;
    boxAnim.style.transform = 'none';
    boxWeb.style.transition = `border-radius ${SNAP_MS}ms ${EASE_OUT_SMOOTH}`;
    boxWeb.style.borderRadius = '0px';
    bgOverlay.style.opacity = '';
    bgOverlay.classList.add('active');
    dockWrap.classList.add('hidden');
    dragCurrentX = 0;
    dragCurrentY = 0;
  }
});

// ─── Kiosk Mode ───
let escPressed = false;
let pointerLocked = false;

async function enterKiosk() {
  if (escPressed) return;
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    try { await el.requestFullscreen(); } catch(e) {}
  }
  if (navigator.keyboard && navigator.keyboard.lock) {
    try {
      await navigator.keyboard.lock([
        'Escape','AltLeft','AltRight','Tab','MetaLeft','MetaRight',
        'F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12',
        'ControlLeft','ControlRight','ShiftLeft','ShiftRight'
      ]);
    } catch(e) {}
  }
  try { await el.requestPointerLock(); } catch(e) {}
}

document.addEventListener('click', enterKiosk, { once: true });
document.addEventListener('touchend', enterKiosk, { once: true });

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && !escPressed) setTimeout(enterKiosk, 200);
  if (document.fullscreenElement) escPressed = false;
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = !!document.pointerLockElement;
  if (!document.pointerLockElement && !escPressed && document.fullscreenElement && appState === 'closed') {
    setTimeout(() => { document.documentElement.requestPointerLock().catch(() => {}); }, 200);
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    escPressed = true;
    if (document.pointerLockElement) document.exitPointerLock();
    if (document.fullscreenElement) document.exitFullscreen();
    return;
  }
  e.preventDefault();
});

history.pushState(null,'',location.href);
history.pushState(null,'',location.href);
history.pushState(null,'',location.href);
window.addEventListener('popstate', () => {
  history.pushState(null,'',location.href);
  enterKiosk();
});
</script>
