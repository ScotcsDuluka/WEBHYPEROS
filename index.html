<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
<title>HyperOS Launcher</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
  cursor: none;
}
img.wallpaper {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}
</style>
</head>
<body>

<img class="wallpaper" src="https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/4b5d40216256937.67b492e0e7551.jpg" alt="">

<script>
// ─── Block everything ───
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());

// Block edge swipe zones
document.addEventListener('touchstart', e => {
  for (const t of e.touches) {
    if (t.clientX < 20 || t.clientX > window.innerWidth - 20) {
      e.preventDefault();
    }
  }
}, { passive: false });

// ─── Lock navigation ───
history.pushState(null, '', location.href);
history.pushState(null, '', location.href);
history.pushState(null, '', location.href);
window.addEventListener('popstate', () => {
  history.pushState(null, '', location.href);
  enterKiosk();
});

// ─── Kiosk mode: Fullscreen + Keyboard Lock + Pointer Lock ───
let escPressed = false;

async function enterKiosk() {
  if (escPressed) return;

  const el = document.documentElement;

  // 1) Fullscreen
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    try {
      if (el.requestFullscreen) await el.requestFullscreen();
      else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
    } catch(e) {}
  }

  // 2) Keyboard Lock — blocks Esc, Alt+Tab, Alt+F4, Win key, etc.
  //    Only works in fullscreen + requires user activation
  if (navigator.keyboard && navigator.keyboard.lock) {
    try {
      await navigator.keyboard.lock([
        'Escape', 'AltLeft', 'AltRight', 'Tab', 'MetaLeft', 'MetaRight',
        'F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12',
        'ControlLeft','ControlRight','ShiftLeft','ShiftRight'
      ]);
    } catch(e) {}
  }

  // 3) Pointer Lock — hides cursor, captures all mouse to this page
  //    Esc to exit (but keyboard lock should block that)
  try {
    await el.requestPointerLock();
  } catch(e) {}
}

// Enter kiosk on first click/tap
function onFirstTap() {
  enterKiosk();
  document.removeEventListener('click', onFirstTap);
  document.removeEventListener('touchend', onFirstTap);
}
document.addEventListener('click', onFirstTap);
document.addEventListener('touchend', onFirstTap);

// Re-enter if something kicks us out
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && !escPressed) {
    setTimeout(enterKiosk, 300);
  }
  if (document.fullscreenElement) escPressed = false;
});

document.addEventListener('pointerlockchange', () => {
  if (!document.pointerLockElement && !escPressed && document.fullscreenElement) {
    setTimeout(() => {
      document.documentElement.requestPointerLock().catch(() => {});
    }, 300);
  }
});

// Keyboard: ESC exits everything, all other keys blocked
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    escPressed = true;
    // Exit pointer lock + fullscreen
    if (document.pointerLockElement) document.exitPointerLock();
    if (document.fullscreenElement) document.exitFullscreen();
    return;
  }
  e.preventDefault();
  e.stopPropagation();
});
</script>

</body>
</html>
