<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
<title>HyperOS Launcher</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
  cursor: none;
}
img.wallpaper {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* ─── Overlay to catch ALL touches (including bottom edge) ─── */
.touch-shield {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 9999;
  cursor: none;
}
</style>
</head>
<body>

<img class="wallpaper" src="https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/4b5d40216256937.67b492e0e7551.jpg" alt="">

<!-- Invisible layer on top of EVERYTHING to eat all touch events -->
<div class="touch-shield" id="shield"></div>

<script>
const shield = document.getElementById('shield');

// ─── Block ALL touch events on shield layer ───
shield.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
shield.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
shield.addEventListener('touchend', e => e.preventDefault(), { passive: false });
shield.addEventListener('touchcancel', e => e.preventDefault(), { passive: false });

// ─── Block everything else ───
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());

// ─── Lock navigation ───
history.pushState(null, '', location.href);
history.pushState(null, '', location.href);
history.pushState(null, '', location.href);
window.addEventListener('popstate', () => {
  history.pushState(null, '', location.href);
  enterKiosk();
});

// ─── Kiosk mode ───
let escPressed = false;

async function enterKiosk() {
  if (escPressed) return;
  const el = document.documentElement;

  // 1) Fullscreen
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    try {
      if (el.requestFullscreen) await el.requestFullscreen();
      else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
    } catch(e) {}
  }

  // 2) Keyboard Lock — block Esc, Alt+Tab, Win, F-keys, etc.
  if (navigator.keyboard && navigator.keyboard.lock) {
    try {
      await navigator.keyboard.lock([
        'Escape', 'AltLeft', 'AltRight', 'Tab', 'MetaLeft', 'MetaRight',
        'F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12',
        'ControlLeft','ControlRight','ShiftLeft','ShiftRight'
      ]);
    } catch(e) {}
  }

  // 3) Pointer Lock — hide cursor, capture mouse
  try {
    await el.requestPointerLock();
  } catch(e) {}
}

// Enter kiosk on first tap on shield
shield.addEventListener('click', () => {
  enterKiosk();
}, { once: true });
shield.addEventListener('touchend', () => {
  enterKiosk();
}, { once: true });

// Re-enter if kicked out
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && !escPressed) {
    setTimeout(enterKiosk, 200);
  }
  if (document.fullscreenElement) escPressed = false;
});

document.addEventListener('pointerlockchange', () => {
  if (!document.pointerLockElement && !escPressed && document.fullscreenElement) {
    setTimeout(() => {
      document.documentElement.requestPointerLock().catch(() => {});
    }, 200);
  }
});

// ESC = only way out
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    escPressed = true;
    if (document.pointerLockElement) document.exitPointerLock();
    if (document.fullscreenElement) document.exitFullscreen();
    return;
  }
  e.preventDefault();
  e.stopPropagation();
});
</script>

</body>
</html>
