<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
<title>HyperOS Launcher</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
  font-family: -apple-system, "SF Pro Display", "Noto Sans SC", system-ui, sans-serif;
}

/* ─── Wallpaper ─── */
img.wallpaper {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* ─── Background Overlay (dim when app open) ─── */
.bg-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.35);
  z-index: 15;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.bg-overlay.active { opacity: 1; }

/* ─── Dock ─── */
.dock-wrap {
  position: fixed;
  bottom: 65px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.dock-wrap.hidden {
  opacity: 0;
  transform: translateX(-50%) translateY(30px);
  pointer-events: none;
}
.dock {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 13px 13px;
  border-radius: 29px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-top-color: rgba(255,255,255,0.14);
  box-shadow: 0 8px 48px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.1);
  position: relative;
}
.dock::before {
  content: '';
  position: absolute;
  top: -1px; left: 15%; right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
}

/* ─── App Icon ─── */
.app-icon {
  width: 52px; height: 52px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s ease;
  position: relative;
  overflow: hidden;
}
.app-icon:active { transform: scale(0.88); }
.app-icon::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.04) 100%);
  border-radius: 13px 13px 0 0;
  pointer-events: none;
}
.app-icon svg { position: relative; z-index: 1; }

/* ─── Box WEB ─── */
.box-web {
  position: fixed;
  z-index: 20;
  display: none;
  background: #fff;
  overflow: hidden;
  will-change: transform, left, top, width, height, border-radius;
}
.box-web.passthrough {
  pointer-events: none;
}
.box-web iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
.box-web.passthrough iframe {
  pointer-events: none;
}

/* ─── Gesture Bar (shared) ─── */
.gesture-bar {
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  width: 160px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 30;
  touch-action: none;
  cursor: grab;
}
.gesture-bar:active { cursor: grabbing; }
.gesture-pill {
  width: 134px;
  height: 5px;
  border-radius: 3px;
  transition: background 0.15s ease, width 0.15s ease;
  pointer-events: none;
}
.gesture-bar:active .gesture-pill {
  width: 110px;
}

/* ─── Home Gesture Bar ─── */
.home-gesture {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: 160px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 12;
  touch-action: none;
  cursor: grab;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.home-gesture.hidden {
  opacity: 0;
  transform: translateX(-50%) translateY(20px);
  pointer-events: none;
}
.home-gesture:active { cursor: grabbing; }
.home-pill {
  width: 134px;
  height: 5px;
  border-radius: 3px;
  background: rgba(255,255,255,0.35);
  transition: background 0.15s ease, width 0.15s ease;
  pointer-events: none;
}
.home-gesture:active .home-pill {
  background: rgba(255,255,255,0.6);
  width: 110px;
}
/* Pill inside box-web (dark bg) */
.gesture-pill {
  background: rgba(0,0,0,0.2);
}
.gesture-bar:active .gesture-pill {
  background: rgba(0,0,0,0.4);
}
</style>
</head>
<body>

<img class="wallpaper" src="https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/4b5d40216256937.67b492e0e7551.jpg" alt="">

<!-- Background Overlay -->
<div class="bg-overlay" id="bgOverlay"></div>

<!-- Box WEB -->
<div class="box-web" id="boxWeb">
  <iframe id="appFrame" src="" allow="autoplay; fullscreen"></iframe>
  <div class="gesture-bar" id="gestureBar">
    <div class="gesture-pill"></div>
  </div>
</div>

<!-- Home Gesture Bar -->
<div class="home-gesture" id="homeGesture">
  <div class="home-pill"></div>
</div>

<!-- Dock -->
<div class="dock-wrap" id="dockWrap">
  <div class="dock">
    <!-- Settings -->
    <div class="app-icon" style="background: linear-gradient(145deg, #CFD8DC, #546E7A);" id="btnSettings">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="white" fill-opacity=".88">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/>
      </svg>
    </div>
    <!-- YouTube -->
    <div class="app-icon" style="background: linear-gradient(145deg, #EF9A9A, #C62828);" id="btnYouTube">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="white" fill-opacity=".9">
        <path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/>
      </svg>
    </div>
  </div>
</div>

<script>
// ─── App State ───
let appState = 'closed'; // closed | opening | open | dragging | closing
let lastIconEl = null;
let pendingUrl = '';
let dragStartX = 0;
let dragStartY = 0;
let dragCurrentX = 0;
let dragCurrentY = 0;
let openTimer = null;
let closeTimer = null;

// Velocity tracking
let lastMoveX = 0, lastMoveY = 0, lastMoveTime = 0;
let velocityX = 0, velocityY = 0;

const boxWeb = document.getElementById('boxWeb');
const appFrame = document.getElementById('appFrame');
const gestureBar = document.getElementById('gestureBar');
const homeGesture = document.getElementById('homeGesture');
const dockWrap = document.getElementById('dockWrap');
const bgOverlay = document.getElementById('bgOverlay');

// ─── Animation Tuning ───
const CLOSE_UP_PX = 50;
const OPEN_MS = 550;           // slower open
const CLOSE_MS = 480;          // slower close
const SNAP_MS = 500;           // snap-back duration
const VELOCITY_CLOSE = 0.4;    // px/ms upward = close on fast flick

// ─── Spring Easing Curves ───
// Bouncy ease-out: fast start → overshoot → settle
const SPRING_OPEN  = 'cubic-bezier(0.08, 1.5, 0.3, 1)';   // open: overshoot past target then settle
const SPRING_CLOSE = 'cubic-bezier(0.4, 0, 0.15, 1)';      // close: fast start, gentle landing
const SPRING_SNAP  = 'cubic-bezier(0.08, 1.6, 0.3, 1)';    // snap-back: extra bouncy

// ─── Helper: Get box current visual rect (accounts for transform) ───
function getBoxVisualRect() {
  const style = window.getComputedStyle(boxWeb);
  const left = parseFloat(boxWeb.style.left) || 0;
  const top = parseFloat(boxWeb.style.top) || 0;
  const width = parseFloat(boxWeb.style.width) || 0;
  const height = parseFloat(boxWeb.style.height) || 0;
  const tx = dragCurrentX || 0;
  const ty = dragCurrentY || 0;

  const transform = style.transform;
  let scale = 1;
  if (transform && transform !== 'none') {
    const m = transform.match(/scale\(([^)]+)\)/);
    if (m) scale = parseFloat(m[1]);
  }

  const sw = width * scale;
  const sh = height * scale;
  const offsetLeft = (width - sw) / 2;
  const offsetTop = (height - sh) / 2;

  return {
    left: left + offsetLeft + tx,
    top: top + offsetTop + ty,
    width: sw,
    height: sh
  };
}

// ─── Helper: Velocity-based close check ───
function shouldClose() {
  // Distance check: swipe up > 50px
  if (dragCurrentY < -CLOSE_UP_PX) return true;
  // Velocity check: fast flick upward
  if (velocityY < -VELOCITY_CLOSE) return true;
  return false;
}

// ─── Helper: Velocity-based snap curve ───
function getSnapCurve() {
  const speed = Math.sqrt(velocityX * velocityX + velocityY * velocityY);
  // Faster release = more bouncy
  if (speed > 1.5) return 'cubic-bezier(0.05, 1.8, 0.25, 1)';  // extra springy
  if (speed > 0.8) return 'cubic-bezier(0.08, 1.6, 0.3, 1)';   // normal spring
  return 'cubic-bezier(0.1, 1.4, 0.35, 1)';                     // gentle spring
}

// ─── Open App (can interrupt closing, can swipe out immediately) ───
function openApp(iconEl, url) {
  if (appState === 'opening' && lastIconEl === iconEl) return;
  if (appState === 'open' && lastIconEl === iconEl) return;

  if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }

  const W = window.innerWidth;
  const H = window.innerHeight;
  const rect = iconEl.getBoundingClientRect();

  // ── Interrupt closing/dragging: morph from current visual position ──
  if (appState === 'closing' || appState === 'dragging') {
    const vr = getBoxVisualRect();

    boxWeb.style.transition = 'none';
    boxWeb.style.transform = 'none';
    boxWeb.style.left = vr.left + 'px';
    boxWeb.style.top = vr.top + 'px';
    boxWeb.style.width = vr.width + 'px';
    boxWeb.style.height = vr.height + 'px';
    boxWeb.style.borderRadius = boxWeb.style.borderRadius || '15px';
    boxWeb.style.opacity = '1';

    void boxWeb.offsetHeight;

    lastIconEl = iconEl;
    pendingUrl = url;

    dockWrap.classList.add('hidden');
    homeGesture.classList.add('hidden');
    bgOverlay.classList.add('active');
    bgOverlay.style.opacity = '';
    boxWeb.classList.remove('passthrough');

    boxWeb.style.transition = `all ${OPEN_MS}ms ${SPRING_OPEN}`;
    boxWeb.style.left = '0px';
    boxWeb.style.top = '0px';
    boxWeb.style.width = W + 'px';
    boxWeb.style.height = H + 'px';
    boxWeb.style.borderRadius = '0px';

    // Can swipe out IMMEDIATELY — set open right away
    appState = 'open';
    dragCurrentX = 0;
    dragCurrentY = 0;

    // Load iframe slightly delayed for smoother animation
    if (openTimer) clearTimeout(openTimer);
    openTimer = setTimeout(() => {
      appFrame.src = url;
      openTimer = null;
    }, 120);

    if (document.pointerLockElement) document.exitPointerLock();
    return;
  }

  // ── Normal open from closed ──
  lastIconEl = iconEl;
  pendingUrl = url;

  boxWeb.style.transition = 'none';
  boxWeb.style.transform = 'none';
  boxWeb.style.display = 'block';
  boxWeb.classList.remove('passthrough');
  boxWeb.style.left = rect.left + 'px';
  boxWeb.style.top = rect.top + 'px';
  boxWeb.style.width = rect.width + 'px';
  boxWeb.style.height = rect.height + 'px';
  boxWeb.style.borderRadius = '15px';
  boxWeb.style.opacity = '1';

  appFrame.src = '';

  void boxWeb.offsetHeight;

  dockWrap.classList.add('hidden');
  homeGesture.classList.add('hidden');
  bgOverlay.classList.add('active');

  boxWeb.style.transition = `all ${OPEN_MS}ms ${SPRING_OPEN}`;
  boxWeb.style.left = '0px';
  boxWeb.style.top = '0px';
  boxWeb.style.width = W + 'px';
  boxWeb.style.height = H + 'px';
  boxWeb.style.borderRadius = '0px';

  // Can swipe out IMMEDIATELY
  appState = 'open';
  dragCurrentX = 0;
  dragCurrentY = 0;

  if (openTimer) clearTimeout(openTimer);
  openTimer = setTimeout(() => {
    appFrame.src = url;
    openTimer = null;
  }, 120);

  if (document.pointerLockElement) document.exitPointerLock();
}

// ─── Close App (animate to icon with spring) ───
function closeApp() {
  if (appState !== 'dragging' && appState !== 'open') return;
  appState = 'closing';

  if (openTimer) { clearTimeout(openTimer); openTimer = null; }

  const rect = lastIconEl.getBoundingClientRect();
  const W = window.innerWidth;
  const H = window.innerHeight;
  const dist = Math.sqrt(dragCurrentX * dragCurrentX + dragCurrentY * dragCurrentY);
  const progress = Math.min(dist / Math.max(W, H), 1);
  const scale = 1 - progress * 0.15;

  // Freeze current visual position
  const vLeft = (W - W * scale) / 2 + dragCurrentX;
  const vTop = (H - H * scale) / 2 + dragCurrentY;
  const vWidth = W * scale;
  const vHeight = H * scale;
  const vRadius = progress * 30;

  boxWeb.style.transition = 'none';
  boxWeb.style.transform = 'none';
  boxWeb.style.left = vLeft + 'px';
  boxWeb.style.top = vTop + 'px';
  boxWeb.style.width = vWidth + 'px';
  boxWeb.style.height = vHeight + 'px';
  boxWeb.style.borderRadius = vRadius + 'px';

  void boxWeb.offsetHeight;

  boxWeb.classList.add('passthrough');
  dockWrap.classList.remove('hidden');
  homeGesture.classList.remove('hidden');
  bgOverlay.classList.remove('active');
  bgOverlay.style.opacity = '';

  // Animate to icon with fast-start-slow-end
  boxWeb.style.transition = `all ${CLOSE_MS}ms ${SPRING_CLOSE}`;
  boxWeb.style.left = rect.left + 'px';
  boxWeb.style.top = rect.top + 'px';
  boxWeb.style.width = rect.width + 'px';
  boxWeb.style.height = rect.height + 'px';
  boxWeb.style.borderRadius = '15px';
  boxWeb.style.opacity = '0.4';

  closeTimer = setTimeout(() => {
    boxWeb.style.display = 'none';
    boxWeb.style.opacity = '1';
    boxWeb.style.transform = 'none';
    boxWeb.classList.remove('passthrough');
    appFrame.src = '';
    dragCurrentX = 0;
    dragCurrentY = 0;
    appState = 'closed';
    closeTimer = null;
    enterKiosk();
  }, CLOSE_MS);
}

// ─── Gesture Bar: Touch Events ───
gestureBar.addEventListener('touchstart', (e) => {
  if (appState !== 'open' && appState !== 'opening') return;
  e.preventDefault();
  e.stopPropagation();

  dragStartX = e.touches[0].clientX;
  dragStartY = e.touches[0].clientY;
  lastMoveX = dragStartX;
  lastMoveY = dragStartY;
  lastMoveTime = performance.now();
  dragCurrentX = 0;
  dragCurrentY = 0;
  velocityX = 0;
  velocityY = 0;
  appState = 'dragging';

  dockWrap.classList.remove('hidden');
  homeGesture.classList.remove('hidden');
  boxWeb.style.transition = 'none';
}, { passive: false });

gestureBar.addEventListener('touchmove', (e) => {
  if (appState !== 'dragging') return;
  e.preventDefault();
  e.stopPropagation();

  const now = performance.now();
  const x = e.touches[0].clientX;
  const y = e.touches[0].clientY;

  // Velocity tracking (last 50ms window)
  const dt = now - lastMoveTime;
  if (dt > 0) {
    velocityX = (x - lastMoveX) / dt;  // px/ms
    velocityY = (y - lastMoveY) / dt;
  }
  lastMoveX = x;
  lastMoveY = y;
  lastMoveTime = now;

  dragCurrentX = x - dragStartX;
  dragCurrentY = y - dragStartY;

  const dist = Math.sqrt(dragCurrentX * dragCurrentX + dragCurrentY * dragCurrentY);
  const maxDim = Math.max(window.innerWidth, window.innerHeight);
  const progress = Math.min(dist / maxDim, 1);
  const scale = 1 - progress * 0.15;

  boxWeb.style.transform = `translate(${dragCurrentX}px, ${dragCurrentY}px) scale(${scale})`;
  boxWeb.style.borderRadius = (progress * 30) + 'px';
  bgOverlay.style.opacity = Math.max(0, 1 - progress * 2);
}, { passive: false });

gestureBar.addEventListener('touchend', () => {
  if (appState !== 'dragging') return;

  if (shouldClose()) {
    closeApp();
  } else {
    appState = 'open';
    const curve = getSnapCurve();
    boxWeb.style.transition = `all ${SNAP_MS}ms ${curve}`;
    boxWeb.style.transform = 'translate(0, 0) scale(1)';
    boxWeb.style.borderRadius = '0px';
    bgOverlay.style.opacity = '';
    bgOverlay.classList.add('active');
    dockWrap.classList.add('hidden');
    homeGesture.classList.add('hidden');
    dragCurrentX = 0;
    dragCurrentY = 0;
  }
});

// ─── Gesture Bar: Mouse Events (desktop test) ───
gestureBar.addEventListener('mousedown', (e) => {
  if (appState !== 'open' && appState !== 'opening') return;
  e.preventDefault();
  e.stopPropagation();

  dragStartX = e.clientX;
  dragStartY = e.clientY;
  lastMoveX = dragStartX;
  lastMoveY = dragStartY;
  lastMoveTime = performance.now();
  dragCurrentX = 0;
  dragCurrentY = 0;
  velocityX = 0;
  velocityY = 0;
  appState = 'dragging';

  dockWrap.classList.remove('hidden');
  homeGesture.classList.remove('hidden');
  boxWeb.style.transition = 'none';
});

document.addEventListener('mousemove', (e) => {
  if (appState !== 'dragging') return;

  const now = performance.now();
  const x = e.clientX;
  const y = e.clientY;

  const dt = now - lastMoveTime;
  if (dt > 0) {
    velocityX = (x - lastMoveX) / dt;
    velocityY = (y - lastMoveY) / dt;
  }
  lastMoveX = x;
  lastMoveY = y;
  lastMoveTime = now;

  dragCurrentX = x - dragStartX;
  dragCurrentY = y - dragStartY;

  const dist = Math.sqrt(dragCurrentX * dragCurrentX + dragCurrentY * dragCurrentY);
  const maxDim = Math.max(window.innerWidth, window.innerHeight);
  const progress = Math.min(dist / maxDim, 1);
  const scale = 1 - progress * 0.15;

  boxWeb.style.transform = `translate(${dragCurrentX}px, ${dragCurrentY}px) scale(${scale})`;
  boxWeb.style.borderRadius = (progress * 30) + 'px';
  bgOverlay.style.opacity = Math.max(0, 1 - progress * 2);
});

document.addEventListener('mouseup', () => {
  if (appState !== 'dragging') return;

  if (shouldClose()) {
    closeApp();
  } else {
    appState = 'open';
    const curve = getSnapCurve();
    boxWeb.style.transition = `all ${SNAP_MS}ms ${curve}`;
    boxWeb.style.transform = 'translate(0, 0) scale(1)';
    boxWeb.style.borderRadius = '0px';
    bgOverlay.style.opacity = '';
    bgOverlay.classList.add('active');
    dockWrap.classList.add('hidden');
    homeGesture.classList.add('hidden');
    dragCurrentX = 0;
    dragCurrentY = 0;
  }
});

// ─── Icon Click Handlers ───
document.getElementById('btnSettings').addEventListener('click', () => {
  openApp(document.getElementById('btnSettings'), 'settings.html');
});

document.getElementById('btnYouTube').addEventListener('click', () => {
  openApp(document.getElementById('btnYouTube'), 'youtube.html');
});

// ─── Block ───
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());

// ─── Kiosk Mode (Fullscreen + Keyboard Lock + Pointer Lock) ───
let escPressed = false;
let pointerLocked = false;

async function enterKiosk() {
  if (escPressed) return;
  const el = document.documentElement;

  if (!document.fullscreenElement) {
    try { await el.requestFullscreen(); } catch(e) {}
  }

  if (navigator.keyboard && navigator.keyboard.lock) {
    try {
      await navigator.keyboard.lock([
        'Escape','AltLeft','AltRight','Tab','MetaLeft','MetaRight',
        'F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12',
        'ControlLeft','ControlRight','ShiftLeft','ShiftRight'
      ]);
    } catch(e) {}
  }

  try { await el.requestPointerLock(); } catch(e) {}
}

document.addEventListener('click', enterKiosk, { once: true });
document.addEventListener('touchend', enterKiosk, { once: true });

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && !escPressed) setTimeout(enterKiosk, 200);
  if (document.fullscreenElement) escPressed = false;
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = !!document.pointerLockElement;
  if (!document.pointerLockElement && !escPressed && document.fullscreenElement && appState === 'closed') {
    setTimeout(() => {
      document.documentElement.requestPointerLock().catch(() => {});
    }, 200);
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    escPressed = true;
