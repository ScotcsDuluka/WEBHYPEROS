<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
<title>HyperOS Launcher</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
}
img.wallpaper {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}
</style>
</head>
<body>

<img class="wallpaper" src="https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/4b5d40216256937.67b492e0e7551.jpg" alt="">

<script>
// Block right-click menu
document.addEventListener('contextmenu', e => e.preventDefault());

// Block pull-to-refresh, swipe gestures
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// Block double-tap zoom
document.addEventListener('dblclick', e => e.preventDefault());

// Block pinch zoom
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());

// Fullscreen on first tap
function goFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  }
  document.removeEventListener('click', goFullscreen);
  document.removeEventListener('touchend', goFullscreen);
}
document.addEventListener('click', goFullscreen);
document.addEventListener('touchend', goFullscreen);

// Re-enter fullscreen if exited by swipe/other methods (NOT by ESC)
let escPressed = false;
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && !escPressed) {
    setTimeout(() => {
      const el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    }, 300);
  }
  if (document.fullscreenElement) escPressed = false;
});

// ESC = only way out, everything else blocked
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    escPressed = true;
    return; // let ESC exit fullscreen
  }
  e.preventDefault(); // block F11, Ctrl+*, Alt+*, etc.
});

// ─── Block back swipe (ChromeOS/Android) ───
// Push history state so swiping back doesn't leave the page
history.pushState(null, '', location.href);
history.pushState(null, '', location.href);
history.pushState(null, '', location.href);

window.addEventListener('popstate', () => {
  // Swiped back → push state again so they can't go further back
  history.pushState(null, '', location.href);
  // Re-enter fullscreen too
  if (!document.fullscreenElement && !escPressed) {
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  }
});

// Block edge swipe start areas (left/right 20px zones)
document.addEventListener('touchstart', e => {
  for (const t of e.touches) {
    if (t.clientX < 20 || t.clientX > window.innerWidth - 20) {
      e.preventDefault();
    }
  }
}, { passive: false });
</script>

</body>
</html>
