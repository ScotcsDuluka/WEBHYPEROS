<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"SF Pro Display","Noto Sans SC",system-ui,sans-serif;background:#000;color:#fff;-webkit-user-select:none;user-select:none;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.viewfinder{flex:1;position:relative;overflow:hidden}
.viewfinder .grid{position:absolute;inset:0;pointer-events:none}
.viewfinder .grid .h-line,.viewfinder .grid .v-line{position:absolute;background:rgba(255,255,255,0.12)}
.viewfinder .grid .h-line{left:0;right:0;height:0.5px}
.viewfinder .grid .h-line:nth-child(1){top:33.33%}
.viewfinder .grid .h-line:nth-child(2){top:66.66%}
.viewfinder .grid .v-line{top:0;bottom:0;width:0.5px}
.viewfinder .grid .v-line:nth-child(3){left:33.33%}
.viewfinder .grid .v-line:nth-child(4){left:66.66%}
.focus-ring{position:absolute;width:70px;height:70px;border:1.5px solid #ffcc00;border-radius:2px;top:50%;left:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity 0.3s}
.focus-ring.show{opacity:1}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;position:relative;z-index:5}
.topbar .btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.topbar .btn svg{width:24px;height:24px;fill:#fff}
.topbar .flash svg{width:22px;height:22px}
.modes{display:flex;gap:18px;justify-content:center;padding:14px 0;position:relative;z-index:5}
.mode{font-size:13px;color:rgba(255,255,255,0.5);cursor:pointer;-webkit-tap-highlight-color:transparent;text-transform:uppercase;letter-spacing:0.5px;font-weight:500}
.mode.active{color:#ffcc00;font-weight:600}
.bottom{padding:0 20px 24px;position:relative;z-index:5}
.shutter-row{display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.gallery{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,0.15);overflow:hidden;border:2px solid rgba(255,255,255,0.3)}
.shutter-btn{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:transparent;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.shutter-btn::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#fff;transition:transform 0.15s,border-radius 0.15s}
.shutter-btn:active::after{transform:scale(0.85);border-radius:6px}
.flip-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip-btn svg{width:24px;height:24px;fill:#fff}
.zoom-bar{display:flex;justify-content:center;gap:20px;padding:16px 0 8px}
.zoom{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.zoom.active{background:rgba(255,204,0,0.25);color:#ffcc00}
.pro-badge{position:absolute;top:14px;right:60px;background:rgba(255,255,255,0.15);padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;letter-spacing:0.5px;cursor:pointer;-webkit-tap-highlight-color:transparent}
</style></head><body>
<div class="topbar">
  <div class="btn flash"><svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg></div>
  <div class="pro-badge">PRO</div>
  <div class="btn"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></div>
</div>
<div class="viewfinder" onclick="document.querySelector('.focus-ring').classList.add('show');setTimeout(()=>document.querySelector('.focus-ring').classList.remove('show'),1500)">
  <div class="grid"><div class="h-line"></div><div class="h-line"></div><div class="v-line"></div><div class="v-line"></div></div>
  <div class="focus-ring"></div>
</div>
<div class="zoom-bar">
  <div class="zoom">.5</div>
  <div class="zoom active">1x</div>
  <div class="zoom">2</div>
  <div class="zoom">5</div>
</div>
<div class="modes">
  <div class="mode">Night</div>
  <div class="mode">Video</div>
  <div class="mode active">Photo</div>
  <div class="mode">Portrait</div>
  <div class="mode">More</div>
</div>
<div class="bottom">
  <div class="shutter-row">
    <div class="gallery"></div>
    <div class="shutter-btn"></div>
    <div class="flip-btn"><svg viewBox="0 0 24 24"><path d="M9 12c0 1.66 1.34 3 3 3s3-1.34 3-3-1.34-3-3-3-3 1.34-3 3zm4 0c0 .55-.45 1-1 1s-1-.45-1-1 .45-1 1-1 1 .45 1 1zm5.59-8.41l-1.17 1.17C16.01 3.56 14.07 3 12 3S7.99 3.56 6.59 4.76L5.41 3.59 4 5l1.17 1.17C3.56 7.99 3 10.07 3 12s.56 4.01 1.76 5.41L3.59 18.59 5 20l1.17-1.17C7.99 20.44 9.93 21 12 21s4.01-.56 5.41-1.76L18.59 20.41 20 19l-1.17-1.17C20.44 16.01 21 13.93 21 12s-.56-4.01-1.76-5.41L20.59 5.41 19 4l-.41.59z"/></svg></div>
  </div>
</div>
</body></html>
